<style>
:root{--bg:#F5F6F9;--surface:#FFFFFF;--border:#E2E5EC;--text-1:#0F1522;--text-2:#4B5468;--text-3:#8A93A3;--blue:#2C4CE0;--blue-bg:#EAEEFC;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text-1)}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{font-size:12px;color:var(--text-2);flex:1;min-width:240px}
nav{display:flex;gap:6px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--text-2)}
.tab b{color:var(--text-1);margin-right:4px}
.tab.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.tab.on b{color:var(--blue)}
#canvas{flex:1;position:relative;background:#FFFFFF}
.tools{display:flex;gap:6px}
.tools button{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}
.tools button:hover,.tab:hover{border-color:var(--blue)}
#err{display:none;padding:16px;color:#B3261E;font-size:13px}
#fallback{display:none;overflow:auto;flex:1;padding:12px}
#fallback img{max-width:none}
</style>
</head>

<script>
(function(){
  var cur = 0, viewer = null;
  var subEl = document.getElementById('sub');
  function xmlOf(i){ return document.getElementById('x'+i).textContent; }
  function meta(i){ var e=document.getElementById('x'+i); return {name:e.dataset.name, sub:e.dataset.sub}; }
  function showFallback(i){
    document.getElementById('canvas').style.display='none';
    var fb=document.getElementById('fallback'); fb.style.display='block';
    fb.innerHTML='<img alt="" src="svg/'+meta(i).name+'.svg">';
  }
  function open(i){
    cur=i; subEl.textContent=meta(i).sub;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', +t.dataset.i===i); });
    try{ history.replaceState(null,'','#'+meta(i).name); }catch(e){}
    if(!viewer){ showFallback(i); return; }
    viewer.importXML(xmlOf(i)).then(function(r){
      fit();
      if(r.warnings && r.warnings.length){ console.warn(r.warnings); }
    }).catch(function(e){ var el=document.getElementById('err'); el.style.display='block'; el.textContent='Import xatosi: '+e.message; });
  }
  function fit(){ try{ viewer && viewer.get('canvas').zoom('fit-viewport', 'auto'); }catch(e){ /* konteyner hali o'lchamsiz */ } }
  if(window.BpmnJS){ viewer = new BpmnJS({container:'#canvas'}); window.addEventListener('resize', fit); }
  document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){ open(+t.dataset.i); }; });
  document.getElementById('fit').onclick=fit;
  document.getElementById('zin').onclick=function(){ if(viewer){ var c=viewer.get('canvas'); c.zoom(c.zoom()*1.2); } };
  document.getElementById('zout').onclick=function(){ if(viewer){ var c=viewer.get('canvas'); c.zoom(c.zoom()/1.2); } };
  document.getElementById('dl').onclick=function(){
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([xmlOf(cur)],{type:'application/xml'}));
    a.download=meta(cur).name+'.bpmn'; document.body.appendChild(a); a.click(); a.remove();
  };
  var start=0, h=decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll('script[type="text/plain"]').forEach(function(s,i){ if(s.dataset.name===h) start=i; });
  open(start);
})();
</script>
