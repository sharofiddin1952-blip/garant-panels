<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Garant Merchant — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — Garant Acquiring dizayn tizimi (admin/merchant panellar bilan bir xil)
   ============================================================ */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-alt:#FAFBFC; --border:#E2E5EC; --border-strong:#CBD2DE;
  --text-1:#0F1522; --text-2:#4B5468; --text-3:#8A93A3;
  --blue:#2C4CE0; --blue-dark:#1E37AE; --blue-bg:#EAEEFC;
  --green:#157A4A; --green-bg:#E4F5EC; --red:#B3261E; --red-bg:#FCEAE9;
  --amber:#A15C00; --amber-bg:#FCEFDD; --purple:#6339B8; --purple-bg:#F0EBFB;
  --navy-1:#0B1220; --navy-2:#121B2E; --navy-text:#C9D2E3; --navy-text-dim:#7C8AA6;
  --radius-lg:10px; --radius-md:7px;
  --shadow-sm:0 1px 2px rgba(15,21,34,0.06); --shadow-md:0 4px 16px rgba(15,21,34,0.10); --shadow-lg:0 12px 40px rgba(15,21,34,0.16);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text-1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-1)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mono{font-family:var(--mono)}
h1{font-size:24px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 4px} h3{font-size:15px;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--text-2)} .dim{color:var(--text-3);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:var(--navy-1);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;font-size:14px;background:none;border:0;color:#fff;padding:0}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
.brand small{display:block;font-size:11px;color:var(--navy-text-dim);font-weight:500;text-align:left}
.proto-tag{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--navy-text)}
.lvl{display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--navy-text);border:1px solid rgba(255,255,255,.12)}
.lvl b{color:#fff;font-family:var(--mono)}
.tb-btn{background:transparent;border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.tb-btn:hover{border-color:#fff}
.tb-btn.fill{background:var(--blue);border-color:var(--blue)}
.who{font-size:13px;color:var(--navy-text)}
.langs{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.langs button{background:transparent;border:0;color:var(--navy-text);font-size:11.5px;font-weight:700;padding:6px 8px}
.langs button.on{background:rgba(255,255,255,.14);color:#fff}
@media (max-width:480px){.langs{display:none}}
.alt-login{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:12px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}

.proto-banner{background:#FFF6E6;color:#7A4A00;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #F2D3A6}
/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 140px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
.card + .card{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.span2{grid-column:1/-1}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.crumbs{font-size:12.5px;color:var(--text-3);margin-bottom:6px}
.crumbs a{color:var(--text-3)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--blue);text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue);padding:0 8px}
.btn.danger{color:var(--red)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.gray{background:#EEF0F4;color:var(--text-2)} .badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.green{background:var(--green-bg);color:var(--green)} .badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)} .badge.purple{background:var(--purple-bg);color:var(--purple)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--radius-lg);border:1px solid;font-size:13.5px}
.alert .ic{font-weight:800;font-size:15px;line-height:1.3}
.alert.info{background:var(--blue-bg);border-color:#C9D3F7} .alert.info .ic{color:var(--blue)}
.alert.warn{background:var(--amber-bg);border-color:#F2D3A6} .alert.warn .ic{color:var(--amber)}
.alert.err{background:var(--red-bg);border-color:#F1C4C0} .alert.err .ic{color:var(--red)}
.alert.ok{background:var(--green-bg);border-color:#BFE3CE} .alert.ok .ic{color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;width:100%}
.field textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.field input[readonly]{background:var(--surface-alt);color:var(--text-2)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red)}
.field .err{color:var(--red);font-size:12px}
.field .hint{color:var(--text-3);font-size:12px}
.src{font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-bg);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.check{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;font-size:13.5px}
.check input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--blue);flex-shrink:0}
.check.on{border-color:var(--blue);background:var(--blue-bg)}
.check .sub{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid var(--border);background:#fff;padding:9px 14px;font-weight:600;color:var(--text-2);font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:22px 0 10px}
.sec:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;font-size:13.5px}
.kv .k{color:var(--text-3)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:12px;color:var(--text-3);font-weight:600;padding:8px;border-bottom:1px solid var(--border)}
.t td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.t input,.t select{height:34px;padding:0 8px;border:1px solid var(--border-strong);border-radius:6px;width:100%;background:#fff}
.t .bad{border-color:var(--red)}
.sum{font-weight:700} .sum.ok{color:var(--green)} .sum.no{color:var(--red)}

/* ---------- landing ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding:18px 0 6px}
.hero h1{font-size:34px;line-height:1.15}
.hero .lead{font-size:16px;color:var(--text-2);margin:12px 0 20px}
.hero-card{background:var(--navy-1);color:var(--navy-text);border-radius:14px;padding:22px}
.hero-card h3{color:#fff}
.hero-card .li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}
.hero-card .li:last-child{border-bottom:0}
.hero-card .li b{color:#fff;font-family:var(--mono);min-width:30px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.step3 .n{width:30px;height:30px;border-radius:8px;background:var(--blue-bg);color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
ul.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
ul.chk li{display:flex;gap:9px}
ul.chk li::before{content:"✓";color:var(--green);font-weight:800}
ul.chk.x li::before{content:"✕";color:var(--red)}

/* ---------- auth ---------- */
.auth{max-width:460px;margin:12px auto}
.auth .card{padding:28px}
.stepdots{display:flex;gap:6px;margin-bottom:18px}
.stepdots i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.stepdots i.on{background:var(--blue)}
.phone{display:flex;align-items:stretch}
.phone span{display:flex;align-items:center;padding:0 12px;border:1px solid var(--border-strong);border-right:0;border-radius:8px 0 0 8px;background:var(--surface-alt);font-weight:600;color:var(--text-2)}
.phone input{border-radius:0 8px 8px 0!important}
.otp{font-family:var(--mono)!important;font-size:26px!important;letter-spacing:14px;text-align:center;height:56px!important}
.pw-meter{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:4px}
.pw-meter i{display:block;height:100%;transition:width .2s}

/* ---------- home ---------- */
.app-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.app-card .org{font-weight:700;font-size:15px}
.mini-prog{display:flex;gap:4px;margin-top:8px}
.mini-prog i{width:34px;height:5px;border-radius:3px;background:var(--border)}
.mini-prog i.d{background:var(--green)} .mini-prog i.c{background:var(--blue)} .mini-prog i.w{background:var(--amber)}
.empty{text-align:center;padding:40px 20px}
.empty .big{width:56px;height:56px;border-radius:14px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:0 auto 14px}

/* ---------- precheck ---------- */
.pc-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pc{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--text-2)}
.pc .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.pc.run .d{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.pc.ok .d{background:var(--green);border-color:var(--green)} .pc.ok .d::after{content:"✓"}
.pc.no .d{background:var(--red);border-color:var(--red)} .pc.no .d::after{content:"!"}
.pc.w .d{background:var(--amber);border-color:var(--amber)} .pc.w .d::after{content:"!"}
.pc.ok,.pc.no,.pc.w{color:var(--text-1)}
.org-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--surface-alt)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- wizard ---------- */
.wiz{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.steps{position:sticky;top:80px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px}
.steps .st{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);font-weight:500;font-size:13.5px;border:0;background:none;width:100%;text-align:left}
.steps .st:hover{background:var(--surface-alt)}
.steps .st.cur{background:var(--blue-bg);color:var(--blue);font-weight:700}
.steps .num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:#fff}
.steps .st.done .num{background:var(--green);border-color:var(--green);color:#fff}
.steps .st.bad .num{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.steps .st.cur .num{border-color:var(--blue);color:var(--blue)}
.steps .st.done.cur .num{color:#fff}
.steps hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.wiz-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.save{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.save .dotg{width:7px;height:7px;border-radius:50%;background:var(--green)}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ---------- docs ---------- */
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;flex-wrap:wrap}
.doc.need{border-color:#F2D3A6;background:#FFFBF4}
.doc .ic{width:38px;height:38px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--text-3);flex-shrink:0}
.doc .ic.ok{background:var(--green-bg);border-color:#BFE3CE;color:var(--green)}
.doc .meta{flex:1;min-width:200px}
.doc .nm{font-weight:600;font-size:13.5px}
.doc .why{font-size:12px;color:var(--text-3)}
.doc .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px;width:180px}
.doc .bar i{display:block;height:100%;background:var(--blue);transition:width .15s}

/* ---------- gate ---------- */
.gate{display:flex;flex-direction:column;gap:5px}
.g{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;font-size:13px}
.g.ok{background:var(--green-bg)} .g.no{background:var(--red-bg)} .g.w{background:var(--amber-bg)} .g.pend{background:var(--surface-alt)}
.g .code{font-family:var(--mono);font-size:11.5px;font-weight:600;min-width:32px;color:var(--text-2);padding-top:1px}
.g .mk{font-weight:800;width:14px}
.g.ok .mk{color:var(--green)} .g.no .mk{color:var(--red)} .g.w .mk{color:var(--amber)}
.g a{font-weight:600;white-space:nowrap}
.review-sec{border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.review-sec + .review-sec{margin-top:10px}
.review-sec .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.review-sec .kv{grid-template-columns:190px 1fr;font-size:13px}

/* ---------- status ---------- */
.prog{display:flex;margin:10px 0 4px}
.prog .ps{flex:1;min-width:0;overflow-wrap:anywhere;position:relative;text-align:center;padding:32px 4px 0;font-size:12.5px;color:var(--text-3);font-weight:500}
.prog .ps::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--text-3);z-index:1;box-sizing:border-box}
.prog .ps::after{content:"";position:absolute;top:12px;left:calc(-50% + 13px);right:calc(50% + 13px);height:2px;background:var(--border-strong)}
.prog .ps:first-child::after{display:none}
.prog .ps.done{color:var(--text-1)}
.prog .ps.done::before{content:"✓";background:var(--green);border-color:var(--green);color:#fff}
.prog .ps.done::after,.prog .ps.cur::after{background:var(--green)}
.prog .ps.cur{color:var(--blue);font-weight:700}
.prog .ps.cur::before{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-bg)}
.prog .ps.warn{color:var(--amber);font-weight:700}
.prog .ps.warn::before{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .ti{position:relative;padding:0 0 14px 6px}
.tl .ti::before{content:"";position:absolute;left:-20px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.tl .ti:first-child::before{background:var(--blue)}
.tl .ti .tt{font-weight:600;font-size:13.5px}
.tl .ti .td{font-size:12px;color:var(--text-3)}
.keys{font-family:var(--mono);font-size:12.5px;background:var(--navy-1);color:#DDE4F3;border-radius:8px;padding:12px 14px;word-break:break-all;line-height:1.7}
.keys span{color:var(--navy-text-dim)}
.prov .pi{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13.5px;color:var(--text-3)}
.prov .pi .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:800}
.prov .pi.done{color:var(--text-1)} .prov .pi.done .dot{background:var(--green);border-color:var(--green)} .prov .pi.done .dot::after{content:"✓"}
.prov .pi.run{color:var(--blue);font-weight:600} .prov .pi.run .dot{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}

/* ---------- contract ---------- */
.contract-doc{border:1px solid var(--border);border-radius:10px;background:#FDFDFE;padding:22px 26px;font-size:13px;line-height:1.65;max-height:380px;overflow:auto;font-family:Georgia,'Times New Roman',serif}
.contract-doc h4{text-align:center;margin:0 0 4px;font-size:14px}
.contract-doc .c{text-align:center;color:var(--text-3);font-size:12px;margin-bottom:14px}
.contract-doc b{font-family:var(--sans)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig .s{border:1px dashed var(--border-strong);border-radius:10px;padding:12px 14px;font-size:13px}
.sig .s.ok{border-style:solid;border-color:#BFE3CE;background:var(--green-bg)}
.sig .s .t{font-weight:700;margin-bottom:2px}
.tariff{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tariff .tc{border:1px solid var(--border);border-radius:10px;padding:12px}
.tariff .tc b{display:block;font-size:18px}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,21,34,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:24px;box-shadow:var(--shadow-lg);max-height:calc(100vh - 32px);overflow:auto}

/* ---------------- yuborish shartlari G01–G15 (docs/22 §6) ---------------- */
function gate(a) {
  const d = a.d;
  const G = [];
  const g = (code, ok, text, fix) => G.push({ code, ok, text, fix });
  g('G01', !!(S.user && S.user.emailVerified), 'Telefon va email tasdiqlangan', S.user && !S.user.emailVerified ? 'verify-email' : null);
  g('G02', true, 'INN to‘g‘ri' + (a.registry === 'MANUAL' ? ' (registrda topilmadi — qo‘lda tekshiriladi)' : ' va registrda mavjud'));
  g('G03', true, 'INN bo‘yicha faol merchant yo‘q');
  g('G04', true, 'INN bo‘yicha boshqa ochiq ariza yo‘q');
  g('G05', a.accountFound && !!d.accountId, a.accountFound ? 'Garant Bankdagi hisob tanlangan (ABS)' : 'Garant Bankda faol hisob topilmadi (ABS)', 'step:5');
  g('G06', !isProhibited(a.industry), 'Taqiqlangan faoliyat tanlanmagan');
  const bad = [1, 2, 4].filter((n) => !stepOk(a, n));
  g('G07', bad.length === 0, 'Barcha maydonlar to‘ldirilgan' + (bad.length ? ' — ' + bad.map((n) => n + '-qadam').join(', ') : ''), bad.length ? 'step:' + bad[0] : null);
  g('G08', isInd(a) || Math.abs(ownersSum(a) - 100) < 0.001, 'Ulushlar yig‘indisi 100%' + (isInd(a) ? ' (jismoniy shaxs — talab qilinmaydi)' : ' (hozir: ' + ownersSum(a) + '%)'), 'step:3');
  const docsMiss = requiredDocs(a).filter((x) => !docOk(a, x.key)).length;
  g('G09', docsMiss === 0, 'Majburiy hujjatlar yuklangan' + (docsMiss ? ' — ' + docsMiss + ' ta yetishmaydi' : ''), 'step:7');
  const st3 = validate(a, 3);
  g('G10', !st3.dirPassExp && !st3.dirPass, 'Pasportlar amal qiladi', 'step:3');
  const st3rest = Object.keys(st3).filter((k) => !['dirPassExp', 'dirPass', 'owners'].includes(k) && !k.startsWith('owners.'));
  if (st3rest.length) G.find((x) => x.code === 'G07').ok = false;
  g('G11', Object.values(d.services || {}).some(Boolean), 'Kamida bitta xizmat tanlangan', 'step:6');
  const st6 = validate(a, 6);
  g('G12', !d.services.ecom || (!st6.website && !st6.scan), d.services.ecom ? 'Sayt HTTPS va SSL amal qiladi (avto-tekshiruv)' : 'Sayt talabi (sayt orqali to‘lov tanlanmagan)', 'step:6');
  if (Object.keys(st6).some((k) => !['website', 'scan', 'services'].includes(k))) G.find((x) => x.code === 'G07').ok = false;
  g('G13', a.role !== 'REP' || docOk(a, 'POA'), a.role === 'REP' ? 'Ishonchnoma yuklangan' : 'Ariza beruvchi — direktor', 'step:7');
  g('G14', DECL.every(([k]) => d.decl[k]), 'Barcha tasdiqlar belgilangan', 'step:8');
  G.push({ code: 'G15', ok: null, text: 'SMS kod bilan tasdiqlash — «Yuborish» bosilganda' });
  return G;
}
function warnings(a) {
  const d = a.d, W = [];

}

ACT['pre-check'] = () => {
  const inn = ($('#preInn').value || '').replace(/\D/g, '');
  if (inn.length !== 9) { $('#preErr').textContent = 'INN 9 ta raqamdan iborat bo‘lishi kerak'; return; }
  const own = S.apps.find((x) => x.inn === inn && !TERMINAL.includes(x.status));
  const rej = S.apps.find((x) => x.inn === inn && x.status === 'REJECTED' && x.rejection && x.rejection.canReapply);
  const sp = SPECIAL[inn], r = REG[inn];
  const plan = [['INN formati va nazorat raqami', 'ok']];
  let outcome = 'OK';
  if (sp === 'BLOCKED') { plan.push(['Dublikat va cheklovlar', 'no']); outcome = 'BLOCKED'; }
  else if (sp === 'MERCHANT') { plan.push(['Faol merchant', 'no', 'topildi']); outcome = 'MERCHANT'; }
  else if (sp === 'OPEN_OTHER') { plan.push(['Ochiq arizalar', 'no', 'boshqa foydalanuvchida']); outcome = 'OPEN_OTHER'; }
  else if (own) { plan.push(['Ochiq arizalar', 'w', 'sizda bor']); outcome = own.status === 'DRAFT' ? 'OWN_DRAFT' : 'OWN_ACTIVE'; }
  else {
    plan.push(['Faol merchant va ochiq arizalar', 'ok', 'topilmadi']);
    plan.push(['Davlat registri', r ? 'ok' : 'w', r ? r.name : 'topilmadi — qo‘lda kiritiladi']);
    if (r && !ALLOWED_FORMS.includes(r.form)) { plan.push(['Tashkiliy shakl', 'no', r.form + ' — qabul qilinmaydi (Q-06)']); outcome = 'FORM'; }
    else {
      plan.push(['Tashkiliy shakl', 'ok', r ? r.form : 'qo‘lda tekshiriladi']);
      if (hasAccount(inn)) plan.push(['Garant Bank hisobi (ABS)', 'ok', 'faol hisob topildi']);
      else { plan.push(['Garant Bank hisobi (ABS)', 'no', 'topilmadi — ariza boshlanmaydi (Q-07)']); outcome = 'NO_ACCOUNT'; }
    }
  }
  S.pre = { inn, phase: 'checking', checks: [], outcome, appId: own ? own.id : null, reapply: rej ? rej.id : null, role: 'DIR', eimzoDir: !!(S.user && S.user.eimzoInn === inn), industry: r ? r.industry : '' };
  let i = 0;
  const step = () => {
    if (S.screen !== 'new' || !S.pre || S.pre.inn !== inn) return;
    if (i < plan.length) { S.pre.checks.push({ t: plan[i][0], s: 'run' }); render(); setTimeout(() => { const p = plan[i]; Object.assign(S.pre.checks[i], { s: p[1], note: p[2] }); i++; render(); setTimeout(step, 120); }, 380); }
    else { S.pre.phase = 'result'; render(); }
  };
  render(); step();
};

const sampleName = (k) => k.split(':')[0].toLowerCase().replace(/_/g, '-') + '.pdf';
function simulateUpload(a, key, file, size) {
  a.docs[key] = { status: 'UPLOADING', p: 0 };
  render();
  const t = setInterval(() => {
    const s = a.docs[key]; if (!s || s.status !== 'UPLOADING') { clearInterval(t); return; }
    s.p = Math.min(100, s.p + 25);
    if (s.p >= 100) { clearInterval(t); a.docs[key] = { status: 'UPLOADED', file, size, at: Date.now() }; touch(a); render(); } else render();
  }, 160);
}

ACT['submit-eimzo'] = () => { $('#subOtp').value = '123456'; toast('E-IMZO imzosi bilan tasdiqlandi (prototip)'); ACT['submit-confirm'](); };
async function sha256(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(16).padStart(8, '0').repeat(8); }
}
function rerenderIf(a) { if (curApp() === a) render(); else save(); }

/* ---------------- modal ---------------- */
function modal(html) { $('#modal').innerHTML = '<div class="modal-bg" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>'; }
function closeModal() { $('#modal').innerHTML = ''; }
ACT['modal-close'] = closeModal;
ACT['modal-bg'] = (el, ev) => { if (ev.target === el) closeModal(); };

/* ---------------- hodisalar ---------------- */
function touch(a) {
  a.updatedAt = Date.now(); saveSoon();
  const s = $('#saveInd'); if (s) s.innerHTML = '<span class="dotg"></span>Saqlandi ' + fmtTime(a.updatedAt);
}
function setPath(obj, path, val) {
  const parts = path.split('.'); let o = obj;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = val;
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' || el.tagName === 'BUTTON') ev.preventDefault();
  if (el.dataset.act === 'modal-bg' && ev.target !== el) return;
  fn(el, ev);
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'rPw') { const v = el.value; const sc = (v.length >= 10) + /\d/.test(v) + /[a-z]/i.test(v) + /[^a-z0-9]/i.test(v) + (v.length >= 14); const m = $('#pwm'); m.style.width = sc * 20 + '%'; m.style.background = sc < 3 ? 'var(--red)' : sc < 4 ? 'var(--amber)' : 'var(--green)'; return; }
  if (!el.dataset || !el.dataset.bind || el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  const a = curApp(); if (!a) return;
  let v = el.value;
  if (el.dataset.bind === 'dirPass' || el.dataset.bind === 'accPass') { v = v.toUpperCase(); el.value = v; }
  setPath(a.d, el.dataset.bind, v); touch(a);
  if (/^owners\.\d+\.share$/.test(el.dataset.bind)) { const s = ownersSum(a), n = $('#ownSum'); if (n) { n.textContent = s + '%'; n.className = 'sum ' + (Math.abs(s - 100) < 0.001 ? 'ok' : 'no'); } }
  if (S.screen === 'info') { const b = document.querySelector('[data-act="info-send"]'); if (b) b.disabled = !infoReady(a); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.actChange === 'pre-industry') { S.pre.industry = el.value; render(); return; }
  if (el.dataset && el.dataset.actChange === 'info-done') { const a = curApp(); a.info.items[Number(el.dataset.i)].done = el.checked; render(); return; }
  if (el.id === 'filePick') {
    const f = el.files && el.files[0]; if (!f || !pickKey) return;
    const okType = /\.(pdf|jpe?g|png|heic)$/i.test(f.name), okSize = f.size <= 10 * 1024 * 1024;
    if (!okType || !okSize) { toast(!okType ? 'Ruxsat etilmagan format (L2): PDF, JPG, PNG, HEIC' : 'Fayl 10 MB dan katta (L2)'); return; }
    simulateUpload(curApp(), pickKey, f.name, (f.size / 1048576).toFixed(1) + ' MB'); return;
  }
  if (!el.dataset || !el.dataset.bind) return;
  const a = curApp(); if (!a) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  setPath(a.d, el.dataset.bind, v); touch(a);
  if (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') render();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  const id = ev.target && ev.target.id;
  const map = { regPhone: 'reg-send', otp: 'reg-verify', preInn: 'pre-check', subOtp: 'submit-confirm', lPw: 'login', eimzo: 'sign-confirm' };
  if (map[id]) { ev.preventDefault(); ACT[map[id]](ev.target); }
});

render();
if (S.screen === 'register' && S.reg.step === 2) tickResend();
