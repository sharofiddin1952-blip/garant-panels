<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilnoza Style &mdash; Merchant Kabinet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS (Garant Acquiring dizayn tizimi bilan bir xil)
   ============================================================ */
:root{
  --bg:#F5F6F9;
  --surface:#FFFFFF;
  --surface-alt:#FAFBFC;
  --border:#E2E5EC;
  --border-strong:#CBD2DE;
  --text-1:#0F1522;
  --text-2:#4B5468;
  --text-3:#8A93A3;
  --blue:#2C4CE0;
  --blue-dark:#1E37AE;
  --blue-bg:#EAEEFC;
  --green:#157A4A;
  --green-bg:#E4F5EC;
  --red:#B3261E;
  --red-bg:#FCEAE9;
  --amber:#A15C00;
  --amber-bg:#FCEFDD;
  --purple:#6339B8;
  --purple-bg:#F0EBFB;
  --navy-1:#0B1220;
  --navy-2:#121B2E;
  --navy-3:#1B2740;
  --navy-text:#C9D2E3;
  --navy-text-dim:#7C8AA6;
  --radius-lg:10px;
  --radius-md:7px;
  --radius-sm:4px;
  --shadow-sm:0 1px 2px rgba(15,21,34,0.06);
  --shadow-md:0 4px 16px rgba(15,21,34,0.10);
  --shadow-lg:0 12px 40px rgba(15,21,34,0.16);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text-1);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CBD2DE;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#9AA4B8;}
a{color:var(--blue);text-decoration:none;}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.mono{font-family:var(--mono);}
.tabular{font-variant-numeric:tabular-nums;}

/* ---------- SHELL ---------- */
.app-shell{display:flex;height:100vh;width:100vw;}
.sidebar{width:230px;flex-shrink:0;background:var(--navy-1);color:var(--navy-text);display:flex;flex-direction:column;transition:width .15s ease;}
.sidebar.collapsed{width:68px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px 18px;border-bottom:1px solid rgba(255,255,255,0.07);}
.sidebar-brand .logo{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
.sidebar-brand .txt{overflow:hidden;white-space:nowrap;}
.sidebar-brand .name{font-size:13px;font-weight:700;color:#fff;}
.sidebar-brand .sub{font-size:10.5px;color:var(--navy-text-dim);margin-top:1px;}
.sidebar.collapsed .txt{display:none;}
.nav-group{padding:14px 10px 4px 10px;}
.nav-group .gl{font-size:10px;font-weight:700;color:var(--navy-text-dim);letter-spacing:.04em;padding:0 8px 6px 8px;white-space:nowrap;}
.sidebar.collapsed .nav-group .gl{display:none;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--navy-text);
  font-size:12.5px;font-weight:500;margin-bottom:1px;white-space:nowrap;overflow:hidden;
  background:none;border:none;width:100%;text-align:left;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-item:hover{background:var(--navy-2);color:#fff;}
.nav-item.active{background:var(--navy-3);color:#fff;}
.nav-item .badge-count{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}
.sidebar.collapsed .nav-item .badge-count{display:none;}
.sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,0.07);}
.collapse-btn{background:transparent;border:none;color:var(--navy-text-dim);font-size:12.5px;display:flex;align-items:center;gap:8px;}
.collapse-btn svg{width:14px;height:14px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:14px;
}
.acc-chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-alt);font-size:11.5px;color:var(--text-2);}
.acc-chip b{color:var(--text-1);font-weight:700;}
.acc-chip svg{width:13px;height:13px;color:var(--text-3);}
.search-wrap{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 11px;background:var(--surface-alt);}
.search-wrap svg{width:14px;height:14px;color:var(--text-3);}
.search-wrap input{border:none;background:transparent;outline:none;width:100%;font-size:12.5px;}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;color:var(--text-2);}
.icon-btn:hover{background:var(--surface-alt);}
.icon-btn svg{width:16px;height:16px;}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface);}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:20px;border:1px solid var(--border);background:var(--surface);}
.user-chip .av{width:26px;height:26px;border-radius:50%;background:var(--purple-bg);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;}
.user-chip .nm{font-size:12px;font-weight:600;}
.user-chip .rl{font-size:10.5px;color:var(--text-3);}

.content{flex:1;overflow:hidden;display:flex;}
.page-scroll{flex:1;overflow-y:auto;padding:22px 26px 40px 26px;}

/* ---------- COMMON COMPONENTS (admin panel bilan bir xil) ---------- */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;}
.page-header h1{font-size:21px;font-weight:700;margin:0 0 4px 0;letter-spacing:-.2px;}
.page-header .desc{color:var(--text-2);font-size:13px;max-width:640px;}
.header-actions{display:flex;gap:8px;flex-shrink:0;}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);padding:8px 14px;border-radius:var(--radius-md);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--surface-alt);border-color:var(--text-3);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn-danger:hover{background:#8f1e18;border-color:#8f1e18;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 15px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.kpi-card .label{font-size:11.5px;color:var(--text-2);font-weight:600;}
.kpi-card .value{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.kpi-card .delta{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:3px;}
.kpi-card .delta.up{color:var(--green);}
.kpi-card .delta.down{color:var(--red);}
.kpi-card .delta svg{width:11px;height:11px;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px;align-items:start;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 16px 14px 16px;}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.panel-title h3{font-size:13.5px;font-weight:700;margin:0;}
.panel-title .sub{font-size:11.5px;color:var(--text-3);font-weight:500;}
.chart-wrap{position:relative;height:230px;}
.chart-wrap.sm{height:170px;}

/* status hero \u2014 "pul kelganmi" katta karta */
.status-hero{border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;gap:18px;}
.status-hero.ok{background:linear-gradient(135deg,#E4F5EC,#EFFBF3);border:1px solid #BFE6D2;}
.status-hero.pending{background:linear-gradient(135deg,#FCEFDD,#FFF7EC);border:1px solid #F0D6A8;}
.status-hero .ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.status-hero.ok .ic{background:var(--green);color:#fff;}
.status-hero.pending .ic{background:var(--amber);color:#fff;}
.status-hero .ic svg{width:26px;height:26px;}
.status-hero .tt{font-size:15px;font-weight:700;color:var(--text-1);}
.status-hero .dd{font-size:12.5px;color:var(--text-2);margin-top:3px;}
.status-hero .amt{margin-left:auto;text-align:right;}
.status-hero .amt .n{font-size:22px;font-weight:800;letter-spacing:-.3px;}
.status-hero .amt .l{font-size:11px;color:var(--text-3);font-weight:600;}

.table-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.tbl-search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 10px;background:var(--surface-alt);min-width:230px;}
.tbl-search svg{width:13px;height:13px;color:var(--text-3);}
.tbl-search input{border:none;background:transparent;outline:none;width:100%;font-size:12.5px;}
.select-filter{border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 9px;background:var(--surface);font-size:12.5px;color:var(--text-1);font-weight:500;}
.tbl-count{font-size:12px;color:var(--text-3);margin-left:auto;font-weight:500;}

.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{text-align:left;font-weight:600;color:var(--text-2);font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-alt);white-space:nowrap;position:sticky;top:0;}
.data-table tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.data-table tbody tr{cursor:pointer;}
.data-table tbody tr:hover{background:var(--surface-alt);}
.data-table .num{text-align:right;font-family:var(--mono);}
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);}
.table-scroll .data-table{border:none;}
.table-scroll thead th:first-child, .table-scroll tbody td:first-child{padding-left:16px;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.blue{background:var(--blue-bg);color:var(--blue);}
.badge.purple{background:var(--purple-bg);color:var(--purple);}
.badge.gray{background:#EDEFF3;color:var(--text-2);}
.badge .dotb{width:5px;height:5px;border-radius:50%;background:currentColor;}

.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--text-3);border-top:1px solid var(--border);}
.pager-btns{display:flex;gap:6px;}
.pager-btns button{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);}
.pager-btns button:hover{background:var(--surface-alt);}
.pager-btns button:disabled{opacity:.4;cursor:not-allowed;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab-btn{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-3);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn:hover{color:var(--text-1);}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-3);text-align:center;}
.empty-state svg{width:36px;height:36px;margin-bottom:12px;opacity:.5;}
.empty-state .t{font-weight:600;color:var(--text-2);margin-bottom:4px;font-size:13px;}
.empty-state .d{font-size:12px;max-width:320px;}

.overlay{position:fixed;inset:0;background:rgba(11,18,32,0.45);z-index:100;display:none;align-items:stretch;justify-content:flex-end;}
.overlay.open{display:flex;}
.drawer{width:560px;max-width:92vw;background:var(--surface);height:100%;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slidein .18s ease;}
@keyframes slidein{from{transform:translateX(24px);opacity:.6;}to{transform:translateX(0);opacity:1;}}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;}
.drawer-close{width:30px;height:30px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--text-2);flex-shrink:0;}
.drawer-close:hover{background:var(--surface-alt);}
.drawer-close svg{width:16px;height:16px;}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px;}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}

.modal-center{position:fixed;inset:0;background:rgba(11,18,32,0.45);z-index:110;display:none;align-items:center;justify-content:center;}
.modal-center.open{display:flex;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:440px;max-width:92vw;box-shadow:var(--shadow-lg);padding:22px;animation:popin .12s ease;}
@keyframes popin{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-box h3{margin:0 0 8px 0;font-size:15px;font-weight:700;}
.modal-box p{margin:0 0 16px 0;color:var(--text-2);font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}

.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.kv{border-bottom:1px solid var(--border);padding-bottom:9px;}
.kv .k{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:3px;}
.kv .v{font-size:13px;font-weight:600;}
.kv .v.mono{font-family:var(--mono);font-size:12px;font-weight:500;}
.section-h{font-size:12px;font-weight:700;color:var(--text-2);margin:20px 0 10px 0;}
.section-h:first-child{margin-top:0;}

.tl{position:relative;padding-left:22px;}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--border);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-22px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--blue);}
.tl-item.done::before{background:var(--green);box-shadow:0 0 0 1.5px var(--green);}
.tl-item.failed::before{background:var(--red);box-shadow:0 0 0 1.5px var(--red);}
.tl-item .tt{font-size:12.5px;font-weight:700;}
.tl-item .td{font-size:11.5px;color:var(--text-3);margin-top:2px;}

.progress-bar-outer{height:8px;background:#EDEFF3;border-radius:5px;overflow:hidden;}
.progress-bar-inner{height:100%;border-radius:5px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-1);color:#fff;padding:12px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:260px;animation:toastin .18s ease;}
@keyframes toastin{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast svg{width:15px;height:15px;flex-shrink:0;}
.toast.ok svg{color:#37D67A;}
.toast.err svg{color:#FF6B5E;}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:8px 10px;font-size:13px;background:var(--surface);}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--blue);outline:none;}
.form-hint{font-size:11.5px;color:var(--text-3);margin-top:4px;}

.line-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.line-item:last-child{border-bottom:none;}

.link-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;background:var(--surface);}
.link-card .lc-url{font-family:var(--mono);font-size:11.5px;color:var(--blue);background:var(--blue-bg);padding:3px 8px;border-radius:5px;}

/* toggle switch */
.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#CBD2DE;border-radius:22px;transition:.15s;}
.switch .slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--blue);}
.switch input:checked + .slider::before{transform:translateX(16px);}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.setting-row .st{font-size:12.5px;font-weight:600;}
.setting-row .sd{font-size:11.5px;color:var(--text-3);margin-top:2px;}

.avatar-circle{width:32px;height:32px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0;}
.team-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.team-row:last-child{border-bottom:none;}

.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.stat-row:last-child{border-bottom:none;}
.stat-row .l{color:var(--text-2);}
.stat-row .v{font-weight:700;}

.api-key-box{display:flex;align-items:center;gap:8px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 12px;font-family:var(--mono);font-size:12px;}
.item-row{display:grid;grid-template-columns:2.2fr .7fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.item-row input,.item-row select{padding:6px 8px;font-size:12px;}
.mini-progress{height:5px;background:#EDEFF3;border-radius:3px;overflow:hidden;margin-top:4px;}
.mini-progress > span{display:block;height:100%;background:var(--blue);border-radius:3px;}
</style>
</head>
<body>

<!-- ICON SPRITE -->
<svg width="0" height="0" style="position:absolute">
<defs>
<symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>

<script>
/* ================================================================
   UTILITIES
   ================================================================ */
function rnd(min,max){return Math.random()*(max-min)+min;}
function rndInt(min,max){return Math.floor(rnd(min,max+1));}
function pick(arr){return arr[rndInt(0,arr.length-1)];}
function pickW(items){ const total=items.reduce((s,i)=>s+i[1],0); let r=rnd(0,total); for(const [v,w] of items){ if(r<w) return v; r-=w; } return items[0][0]; }
function uid(prefix,n){return prefix+'-'+String(n).padStart(5,'0');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(amount,currency){
  const abs=Math.round(amount);
  let s=Math.abs(abs).toLocaleString('ru-RU').replace(/,/g,' ');
  const sign=amount<0?'-':'';
  if(currency==='USD') return sign+'$'+s;
  return sign+s+" so'm";
}
function fmtCompact(n){
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2)+' mlrd';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+' mln';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(0)+' ming';
  return String(Math.round(n));
}
function fmtDate(d){ const dt=(d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d){ const dt=(d instanceof Date)?d:new Date(d); return fmtDate(dt)+' '+dt.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}); }
function daysBetween(a,b){return Math.ceil((b.getTime()-a.getTime())/86400000);}
function daysAgo(n){return new Date(Date.now()-n*86400000-rndInt(0,80000)*1000);}
function daysFromNow(n){return new Date(Date.now()+n*86400000);}

/* ================================================================
   REFERENCE DATA
   ================================================================ */
const CUSTOMER_FIRST=['Aziz','Dilnoza','Bekzod','Malika','Sardor','Nilufar','Jasur','Kamola','Otabek','Shahnoza','Farrux','Gulnora','Sherzod','Zarina','Ulug\u2018bek','Madina','Rustam','Sitora','Timur','Nodira','Jamshid','Feruza','Bobur','Lola','Anvar'];
const CUSTOMER_LAST=['Rashidov','Yusupova','Tursunov','Karimova','Ahmedov','Nazarova','Sultonov','Aliyeva','Mirzoyev','Yoldasheva','Qodirov','Xoliqova'];
const PAYMENT_METHODS=['Uzcard','Humo','Visa','Mastercard'];
const PM_SHARE=[['Uzcard',44],['Humo',38],['Visa',12],['Mastercard',6]];
const PRODUCTS=['Ayollar ko\u2018ylagi','Erkaklar kostyumi','Bolalar kurtkasi','Sport krossovka','Jinsi shim','Yozgi sarafan','Palto','Futbolka to\u2018plami','Sumka','Poyabzal'];
const DECLINE_REASONS=['Yetarli mablag\u2018 yo\u2018q','Karta muddati tugagan','CVV xato','3DS/OTP tasdiqlanmadi','Limitdan oshib ketdi','Emitent bank rad etdi'];

const STATE={
  merchant:{
    businessName:'Dilnoza Style', legalName:'"Dilnoza Style" MChJ', inn:'306481725',
    businessType:'Yakka tartibdagi tadbirkor (YaTT)', regNumber:'YATT-2024-08841',
    mcc:'5651', category:'Kiyim-kechak', website:'https://dilnozastyle.uz', address:'Toshkent sh., Chilonzor tumani, 14-mavze',
    contactEmail:'info@dilnozastyle.uz', contactPhone:'+998 90 123 45 67',
    contractNumber:'IE-1042/2025', contractDate:new Date('2025-11-12'),
    bankAccount:'**** 4821', bankAccountOwner:'"Dilnoza Style" MChJ', bankName:'Garant Bank', settlementCycle:'T+1', bankVerified:true,
    mdrUzcard:'1.20', mdrHumo:'1.20', mdrVisa:'1.60', mdrMastercard:'1.60', fixedFee:500,
    kycStatus:'Tasdiqlangan',
  },
  transactions:[], settlements:[], refunds:[], links:[], notifications:[],
  invoices:[], customers:[], team:[], apiKeys:[], webhooks:[], sessions:[], loginHistory:[], tickets:[],
  notifSettings:{
    email:{payment:true, refund:true, settlement:true, invoice:true},
    sms:{payment:false, refund:true, settlement:true, invoice:false},
    push:{payment:true, refund:true, settlement:true, invoice:true},
  },
  sidebarCollapsed:false, currentPage:'dashboard', filters:{}, seq:{tx:4000,rf:1,ln:1,inv:1,tk:1},
};

const STATUS_COLOR={
  'Muvaffaqiyatli':'green','Rad etilgan':'red','Kutilmoqda':'amber','Qaytarilgan':'purple','Bekor qilingan':'gray',
  'Bankka o\u2018tkazildi':'green','Yo\u2018lda':'blue','Tushdi':'green',
  'Bajarildi':'green','Muvaffaqiyatsiz':'red',
  'Faol':'green','Muddati tugagan':'gray','To\u2018landi':'green',
  'Qisman qaytarilgan':'purple','Qoralama':'gray','Yuborilgan':'blue','Ko\u2018rilgan':'blue','Qisman to\u2018langan':'amber',
  'Rejalashtirilgan':'blue','Jarayonda':'blue','Qaytarib olindi':'red',
  'Taklif yuborilgan':'blue','Faol emas':'gray',
  'Ochiq':'blue','Javob berilgan':'amber','Yopilgan':'gray',
};
function badge(text){ const c=STATUS_COLOR[text]||'gray'; return '<span class="badge '+c+'"><span class="dotb"></span>'+esc(text)+'</span>'; }
function badgeC(text,color){ return '<span class="badge '+color+'"><span class="dotb"></span>'+esc(text)+'</span>'; }

/* ================================================================
   DATA GENERATION
   ================================================================ */
function genTransactions(n){
  const out=[]; const now=Date.now();
  for(let i=0;i<n;i++){
    const status=pickW([['Muvaffaqiyatli',80],['Rad etilgan',9],['Kutilmoqda',3],['Qaytarilgan',3],['Qisman qaytarilgan',3],['Bekor qilingan',2]]);
    const method=pickW(PM_SHARE);
    const amount=Math.round(rnd(45000,1850000));
    const created=new Date(now-rndInt(0,42)*86400000-rndInt(0,86400)*1000);
    const approved=status==='Muvaffaqiyatli'||status==='Qaytarilgan'||status==='Qisman qaytarilgan';
    const fn=pick(CUSTOMER_FIRST), ln=pick(CUSTOMER_LAST);
    const fee=Math.round(amount*0.013);
    let refundedAmount=0;
    if(status==='Qaytarilgan') refundedAmount=amount;
    else if(status==='Qisman qaytarilgan') refundedAmount=Math.round(amount*rnd(0.2,0.6));
    out.push({
      id:uid('TXN',STATE.seq.tx++),
      orderId:'ORD-'+rndInt(100000,999999),
      customerName:fn+' '+ln,
      customerPhone:'+998 '+rndInt(90,99)+' '+rndInt(100,999)+' '+rndInt(10,99)+' '+rndInt(10,99),
      customerEmail:fn.toLowerCase()+'.'+ln.toLowerCase()+'@mail.uz',
      product:pick(PRODUCTS),
      amount, currency:'UZS', paymentMethod:method,
      last4:String(rndInt(1000,9999)),
      status, fee, netAmount:amount-fee, refundedAmount,
      authCode: approved? String(rndInt(100000,999999)) : '\u2014',
      rrn:String(rndInt(100000000000,999999999999)).slice(0,12),
      responseMessage: approved? 'Tasdiqlandi' : pick(DECLINE_REASONS),
      createdAt:created,
      completedAt: approved? new Date(created.getTime()+60000) : null,
      settled: approved && daysBetween(created,new Date())>=1,
      settlementStatus: !approved? '\u2014' : (daysBetween(created,new Date())>=1 ? 'Bajarildi' : 'Kutilmoqda'),
    });
  }
  return out.sort((a,b)=>b.createdAt-a.createdAt);
}
function genSettlements(transactions){
  const byDay={};
  transactions.filter(t=>t.status==='Muvaffaqiyatli'||t.status==='Qisman qaytarilgan'||t.status==='Qaytarilgan').forEach(t=>{
    const key=t.createdAt.toDateString();
    if(!byDay[key]) byDay[key]={date:new Date(t.createdAt.getFullYear(),t.createdAt.getMonth(),t.createdAt.getDate()), gross:0, count:0, refunds:0, txIds:[]};
    byDay[key].gross+=t.amount; byDay[key].count++; byDay[key].refunds+=t.refundedAmount||0; byDay[key].txIds.push(t.id);
  });
  const out=Object.values(byDay).map((d,i)=>{
    const fees=Math.round(d.gross*0.013);
    const net=d.gross-fees-d.refunds;
    const daysSince=daysBetween(d.date,new Date());
    let status, arrivalDate=null;
    if(daysSince<1){ status='Rejalashtirilgan'; }
    else if(daysSince===1){ status='Jarayonda'; }
    else { status='Bajarildi'; arrivalDate=new Date(d.date.getTime()+2*86400000); }
    return {
      id:uid('SET',i+1), reference:'SET-2026-'+String(90000+i), date:d.date, gross:d.gross, txCount:d.count, txIds:d.txIds,
      fees, refunds:d.refunds, net, status, arrivalDate, bankAccount:STATE.merchant.bankAccount,
    };
  });
  return out.sort((a,b)=>b.date-a.date);
}
function genRefunds(transactions){
  const pool=transactions.filter(t=>t.status==='Qaytarilgan'||t.status==='Qisman qaytarilgan');
  return pool.map((t,i)=>({
    id:uid('RF',i+1), transactionId:t.id, orderId:t.orderId, customerName:t.customerName,
    amount:t.refundedAmount, currency:t.currency, type: t.status==='Qaytarilgan'?'To\u2018liq':'Qisman',
    reason:pick(['Mijoz talabi','Tovar qaytarildi','O\u2018lchov mos kelmadi','Buyurtma bekor qilindi','Noto\u2018g\u2018ri summa']),
    status:pickW([['Bajarildi',75],['Kutilmoqda',20],['Muvaffaqiyatsiz',5]]),
    date:daysAgo(rndInt(0,20)),
  })).sort((a,b)=>b.date-a.date);
}
function genLinks(){
  const out=[];
  for(let i=0;i<9;i++){
    const amount=Math.round(rnd(80000,1200000));
    const created=daysAgo(rndInt(0,15));
    const status=pickW([['To\u2018landi',50],['Faol',32],['Muddati tugagan',13],['Faol emas',5]]);
    const views=rndInt(40,900);
    const attempts=Math.round(views*rnd(0.1,0.22));
    const successful= status==='To\u2018landi'? Math.round(attempts*rnd(0.7,0.95)) : Math.round(attempts*rnd(0,0.6));
    out.push({
      id:uid('LNK',i+1), title:pick(PRODUCTS)+' uchun to\u2018lov', url:'pay.garantbank.uz/p/'+Math.random().toString(36).slice(2,9),
      amount, currency:'UZS', description:pick(PRODUCTS)+' buyurtmasi uchun to\u2018lov havolasi',
      customerPhone:'+998 '+rndInt(90,99)+' '+rndInt(100,999)+' '+rndInt(10,99)+' '+rndInt(10,99),
      allowCustomAmount:Math.random()<0.2, methods:['Uzcard','Humo','Visa','Mastercard'],
      status, created, expiresAt:new Date(created.getTime()+3*86400000),
      views, attempts, successful, collected: successful*amount,
    });
  }
  return out.sort((a,b)=>b.created-a.created);
}
function genCustomers(transactions){
  const map={};
  transactions.forEach(t=>{
    if(!map[t.customerPhone]) map[t.customerPhone]={
      name:t.customerName, phone:t.customerPhone, email:t.customerEmail,
      totalPayments:0, totalSpent:0, refunds:0, lastPayment:t.createdAt, firstSeen:t.createdAt,
    };
    const c=map[t.customerPhone];
    if(t.status==='Muvaffaqiyatli'||t.status==='Qisman qaytarilgan'||t.status==='Qaytarilgan'){ c.totalPayments++; c.totalSpent+=t.amount; }
    if(t.refundedAmount) c.refunds++;
    if(t.createdAt>c.lastPayment) c.lastPayment=t.createdAt;
    if(t.createdAt<c.firstSeen) c.firstSeen=t.createdAt;
  });
  return Object.values(map).sort((a,b)=>b.totalSpent-a.totalSpent);
}

function paginate(arr,page,pageSize){
  const total=arr.length, totalPages=Math.max(1,Math.ceil(total/pageSize));
  page=clamp(page,1,totalPages);
  const start=(page-1)*pageSize;
  return {rows:arr.slice(start,start+pageSize), page, totalPages, total, shown:Math.min(pageSize,total-start)};
}
function getFilter(key,defaults){
  if(!STATE.filters[key]) STATE.filters[key]=Object.assign({search:'',status:'all',page:1,pageSize:8},defaults||{});
  return STATE.filters[key];
}
function pagerHTML(key,p){
  return '<div class="pager"><div>'+p.total+' ta yozuvdan '+((p.page-1)*8+1)+'\u2013'+((p.page-1)*8+p.rows.length)+' ko\u2018rsatilmoqda</div>'+
    '<div class="pager-btns">'+
    '<button data-action="page" data-key="'+key+'" data-dir="-1" '+(p.page<=1?'disabled':'')+'><svg style="width:13px;height:13px"><use href="#i-chevron-l"/></svg></button>'+
    '<button data-action="page" data-key="'+key+'" data-dir="1" '+(p.page>=p.totalPages?'disabled':'')+' style="transform:scaleX(-1)"><svg style="width:13px;height:13px"><use href="#i-chevron-l"/></svg></button>'+
    '</div></div>';
}
function toolbarHTML(key,placeholder,statusOptions){
  const f=getFilter(key);
  let html='<div class="table-toolbar">';
  html+='<div class="tbl-search"><svg><use href="#i-search"/></svg><input type="text" data-action="search" data-key="'+key+'" placeholder="'+placeholder+'" value="'+esc(f.search)+'"></div>';
  if(statusOptions){
    html+='<select class="select-filter" data-action="filter-status" data-key="'+key+'">';
    html+='<option value="all">Barcha holatlar</option>';
    statusOptions.forEach(o=>{ html+='<option value="'+esc(o)+'" '+(f.status===o?'selected':'')+'>'+esc(o)+'</option>'; });
    html+='</select>';
  }
  html+='</div>';
  return html;
}
function applySearch(rows,search,fields){
  if(!search) return rows;
  const s=search.toLowerCase();
  return rows.filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(s)));
}

function computeKPIs(){
  const tx=STATE.transactions;
  const today=new Date().toDateString();
  const todayTx=tx.filter(t=>t.createdAt.toDateString()===today && t.status==='Muvaffaqiyatli');
  const todayVol=todayTx.reduce((s,t)=>s+t.amount,0);
  const monthStart=new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const monthTx=tx.filter(t=>t.createdAt>=monthStart && t.status==='Muvaffaqiyatli');
  const monthVol=monthTx.reduce((s,t)=>s+t.amount,0);
  const approved=tx.filter(t=>t.status==='Muvaffaqiyatli').length;
  const approvalRate= tx.length? (approved/tx.length*100) : 0;
  return {todayVol, todayCount:todayTx.length, monthVol, approvalRate};
}

function computeInvoiceTotals(items){
  const subtotal=items.reduce((s,it)=>s+it.qty*it.price,0);
  const tax=Math.round(subtotal*0.12);
  return {subtotal, tax, total:subtotal+tax};
}

  );
  let rowsShown=1;
  document.getElementById('invAddRowBtn').onclick=function(){
    if(rowsShown===1){ document.querySelector('.inv-row2').style.display='flex'; rowsShown=2; }
    else if(rowsShown===2){ document.querySelector('.inv-row3').style.display='flex'; rowsShown=3; this.style.display='none'; }
  };
  function collectItems(){
    const names=document.querySelectorAll('.inv-item-name'), qtys=document.querySelectorAll('.inv-item-qty'), prices=document.querySelectorAll('.inv-item-price');
    const items=[];
    for(let i=0;i<names.length;i++){
      const name=names[i].value.trim();
      if(!name) continue;
      const qty=parseFloat(qtys[i].value)||1, price=parseFloat(prices[i].value)||0;
      items.push({name, qty, price, tax:12, discount:0});
    }
    return items;
  }
  function recalc(){
    const items=collectItems();
    const t=computeInvoiceTotals(items);
    document.getElementById('invTotalsBox').innerHTML=
      '<div class="line-item"><span>Oraliq summa</span><span>'+fmtMoney(t.subtotal,'UZS')+'</span></div>'+

  }
  document.getElementById('modalBox').addEventListener('input', recalc);
  recalc();
  function saveInvoice(status){
    const name=document.getElementById('invCustName').value.trim()||'Nomsiz mijoz';
    const phone=document.getElementById('invCustPhone').value.trim()||'\u2014';
    const email=document.getElementById('invCustEmail').value.trim()||'\u2014';
    const items=collectItems();

    const t=computeInvoiceTotals(items);
    const inv={id:uid('INV',STATE.seq.inv++), number:'INV-2026-'+String(1000+STATE.invoices.length), customerName:name, customerPhone:phone, customerEmail:email,
      items, subtotal:t.subtotal, tax:t.tax, discount:0, total:t.total, currency:'UZS', status, created:new Date(), expiresAt:daysFromNow(7), paidAmount:0,
      url:'pay.garantbank.uz/inv/'+Math.random().toString(36).slice(2,9)};
    STATE.invoices.unshift(inv);
    closeModal(); refreshPage();
    toast(status==='Qoralama'?'Qoralama saqlandi':'Hisob-faktura yaratildi va yuborildi','ok');
  }
  document.getElementById('invDraftBtn').onclick=function(){ saveInvoice('Qoralama'); };
  document.getElementById('invSendBtn').onclick=function(){ saveInvoice('Yuborilgan'); };
}

function computeBalance(){
  const pending=STATE.settlements.filter(s=>s.status==='Rejalashtirilgan').reduce((s,x)=>s+x.net,0);
  const available=STATE.settlements.filter(s=>s.status==='Jarayonda').reduce((s,x)=>s+x.net,0);
  const total=pending+available;
  const nextSettlement=STATE.settlements.filter(s=>s.status!=='Bajarildi').sort((a,b)=>a.date-b.date)[0];
  const lastSettlement=STATE.settlements.find(s=>s.status==='Bajarildi');
  const periodFees=STATE.settlements.reduce((s,x)=>s+x.fees,0);
  return {pending, available, total, nextSettlement, lastSettlement, periodFees};
}

function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={}; }
const PAGE_RENDERERS={
  dashboard:{render:renderDashboard, after:()=>{ destroyCharts(); paintDashboardCharts(); }},
  transactions:{render:renderPayments},
  invoices:{render:renderInvoices},
  links:{render:renderLinks},
  customers:{render:renderCustomers},
  balance:{render:renderBalance},
  settlements:{render:renderSettlements},
  fees:{render:renderFees},
  reports:{render:renderReports},
  business:{render:renderBusiness},
  bankaccount:{render:renderBankAccount},
  team:{render:renderTeam},
  developers:{render:renderDevelopers},
  notifications:{render:renderNotifications},
  security:{render:renderSecurity},
  support:{render:renderSupport},
};
function showPage(key){
  if(!PAGE_RENDERERS[key]) key='dashboard';
  STATE.currentPage=key;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===key));
  const root=document.getElementById('pagesRoot');
  root.innerHTML=PAGE_RENDERERS[key].render();
  const scroller=document.getElementById('pageScroll'); if(scroller) scroller.scrollTop=0;
  if(PAGE_RENDERERS[key].after) PAGE_RENDERERS[key].after();
  updateSidebarBadges();
}
function updateSidebarBadges(){
  const unread=STATE.notifications.filter(n=>!n.read).length;
  const nb=document.getElementById('navBadgeNotif');
  if(nb){ nb.textContent=unread||''; nb.style.display=unread?'':'none'; }
  const openTk=STATE.tickets.filter(t=>t.status!=='Yopilgan').length;
  const sb=document.getElementById('navBadgeSupport');
  if(sb){ sb.textContent=openTk||''; sb.style.display=openTk?'':'none'; }
  const dot=document.getElementById('notifDot');
  if(dot) dot.style.display=unread?'':'none';
}
function refreshPage(){ showPage(STATE.currentPage); }

function openConfirm(title,desc,label,danger,onConfirm){

  document.getElementById('modalConfirmBtn').onclick=function(){ onConfirm(); closeModal(); };
}
let toastSeq=0;
function toast(msg,type){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast '+(type==='err'?'err':'ok');
  el.innerHTML='<svg><use href="#i-'+(type==='err'?'close':'check')+'"/></svg><span>'+esc(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); },3200);
}

/* ================================================================
   DETAIL OPENERS / ACTIONS
   ================================================================ */
function openTxDrawer(t){
  const d=txDetailHTML(t);
  const canReceipt=t.status==='Muvaffaqiyatli'||t.status==='Qaytarilgan'||t.status==='Qisman qaytarilgan';
  const foot='<button class="btn" data-action="close-drawer">Yopish</button>'+
    (canReceipt? '<button class="btn" data-action="download-receipt" data-id="'+t.id+'"><svg><use href="#i-download"/></svg>Chek</button>' : '')+
    (d.canRefund? '<button class="btn btn-danger" data-action="refund-tx" data-id="'+t.id+'">Refund</button>' : '');
  openDrawer(d.body, foot);
}
function openSettlementDrawer(s){
  openDrawer(settlementDetailHTML(s),
    '<button class="btn" data-action="close-drawer">Yopish</button>'+
    '<button class="btn btn-primary" data-action="download-statement" data-id="'+s.id+'"><svg><use href="#i-download"/></svg>Statement yuklab olish</button>');
}
function doRefundTx(id){
  const t=STATE.transactions.find(x=>x.id===id); if(!t) return;
  const remaining=t.amount-(t.refundedAmount||0);
  openModalRaw(
    '<h3>To\u2018lovni qaytarish</h3>'+
    '<div class="kv-grid" style="margin-bottom:14px">'+
      '<div class="kv"><div class="k">Tranzaksiya</div><div class="v mono">'+t.id+'</div></div>'+
      '<div class="kv" style="border-bottom:none"><div class="k">Boshlang\u2018ich summa</div><div class="v">'+fmtMoney(t.amount,t.currency)+'</div></div>'+
    '</div>'+
    (t.refundedAmount? '<div class="form-hint" style="margin-bottom:10px">Allaqachon qaytarilgan: '+fmtMoney(t.refundedAmount,t.currency)+'. Maksimal qaytarish mumkin: <b>'+fmtMoney(remaining,t.currency)+'</b></div>' : '')+
    '<div class="form-row"><label>Qaytarish turi</label><select id="rfType"><option value="full">To\u2018liq qaytarish</option><option value="partial">Qisman qaytarish</option></select></div>'+
    '<div class="form-row" id="rfAmountRow" style="display:none"><label>Qaytariladigan summa (so\'m)</label><input type="number" id="rfAmount" value="'+remaining+'" max="'+remaining+'"><div class="form-hint">Maksimal: '+fmtMoney(remaining,t.currency)+'</div></div>'+
    '<div class="form-row"><label>Sabab</label><select id="rfReason"><option>Mijoz talabi</option><option>Takroriy to\u2018lov</option><option>Mahsulot mavjud emas</option><option>Noto\u2018g\u2018ri summa</option><option>Boshqa</option></select></div>'+
    '<div class="form-row"><label>Izoh (ixtiyoriy)</label><textarea id="rfNote" rows="2"></textarea></div>'+
    '<div class="modal-actions"><button class="btn" data-action="close-modal">Bekor qilish</button><button class="btn btn-danger" id="rfConfirmBtn">Refundni tasdiqlash</button></div>'
  );
  const typeEl=document.getElementById('rfType'), rowEl=document.getElementById('rfAmountRow');
  typeEl.onchange=function(){ rowEl.style.display=typeEl.value==='partial'?'':'none'; };
  document.getElementById('rfConfirmBtn').onclick=function(){
    const isPartial=typeEl.value==='partial';
    let amount=remaining;
    if(isPartial){
      amount=parseFloat(document.getElementById('rfAmount').value)||0;
      if(amount<=0 || amount>remaining){ toast('Summa 0 dan katta va '+fmtMoney(remaining,t.currency)+' dan kichik/teng bo\u2018lishi kerak','err'); return; }
    }
    const reason=document.getElementById('rfReason').value;
    t.refundedAmount=(t.refundedAmount||0)+amount;
    const before=t.status;
    t.status = (t.refundedAmount>=t.amount) ? 'Qaytarilgan' : 'Qisman qaytarilgan';
    const rf={id:uid('RF',STATE.refunds.length+1), transactionId:t.id, orderId:t.orderId, customerName:t.customerName, amount, currency:t.currency, type: isPartial?'Qisman':'To\u2018liq', reason, status:'Bajarildi', date:new Date()};
    STATE.refunds.unshift(rf);
    closeModal();
    openModalRaw(
      '<h3>Refund muvaffaqiyatli</h3>'+
      '<div class="line-item"><span>Refund ID</span><span class="mono">'+rf.id+'</span></div>'+
      '<div class="line-item"><span>Summa</span><span style="font-weight:700">'+fmtMoney(amount,t.currency)+'</span></div>'+
      '<div class="line-item" style="border-bottom:none"><span>Holat</span><span>'+badge('Bajarildi')+'</span></div>'+
      '<div class="modal-actions" style="margin-top:14px"><button class="btn btn-primary" data-action="close-modal">Yopish</button></div>'
    );
    closeDrawer(); refreshPage(); toast('Refund yuborildi: '+fmtMoney(amount,t.currency),'ok');
  };
}
function doDownloadReceipt(id){ const t=STATE.transactions.find(x=>x.id===id); if(!t) return; toast('Chek yuklab olinmoqda: '+t.id+' (demo)','ok'); }
function doDownloadStatement(id){ const s=STATE.settlements.find(x=>x.id===id); if(!s) return; toast('Statement yuklab olinmoqda: '+(s.reference||s.id)+' (demo)','ok'); }
function doExportTx(fmt){ toast('Tranzaksiyalar '+fmt+' formatida eksport qilinmoqda (demo)','ok'); }
function doNewLink(){
  openModalRaw(

    '<div class="form-row"><label>Tavsif</label><input type="text" id="lnkDesc" placeholder="Masalan: Ayollar ko\u2018ylagi uchun to\u2018lov"></div>'+
    '<div class="form-row"><label>Mijoz telefon raqami (ixtiyoriy)</label><input type="text" id="lnkPhone" placeholder="+998 90 123 45 67"></div>'+
    '<div class="form-row"><label>Amal qilish muddati (kun)</label><input type="number" id="lnkExpiry" value="3"></div>'+

  document.getElementById('lnkSaveBtn').onclick=function(){

    closeModal(); refreshPage(); toast('Yangi to\u2018lov havolasi yaratildi','ok');

function doDisableLink(id){
  const l=STATE.links.find(x=>x.id===id); if(!l) return;
  openConfirm('Havolani o\u2018chirish', '"'+l.title+'" havolasini o\u2018chirishni tasdiqlaysizmi? Mijozlar endi bu havola orqali to\u2018lov qila olmaydi.', 'O\u2018chirish', true, ()=>{

  });
}
function doCopyLink(id){

}
function doDownloadReport(name){ toast('"'+name+'" yuklab olinmoqda (demo)','ok'); }

/* ================================================================
   NOTIFICATION PANEL
   ================================================================ */
function toggleNotifPanel(){
  let panel=document.getElementById('notifPanel');
  if(panel){ panel.remove(); return; }
  panel=document.createElement('div'); panel.id='notifPanel';
  panel.style.cssText='position:fixed;top:56px;right:120px;width:340px;max-height:400px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);z-index:90;padding:14px 16px;';
  panel.innerHTML='<div style="font-weight:700;font-size:13px;margin-bottom:8px">Bildirishnomalar</div>'+
    STATE.notifications.map(n=>'<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" data-action="nav" data-page="'+n.page+'">'+
      '<div style="width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0;background:'+(n.level==='ok'?'var(--green)':n.level==='warn'?'var(--amber)':'var(--blue)')+'"></div>'+
      '<div><div style="font-size:12px;font-weight:600">'+esc(n.text)+'</div><div style="font-size:11px;color:var(--text-3);margin-top:2px">'+esc(n.meta)+'</div></div></div>').join('');
  document.body.appendChild(panel);
  setTimeout(()=>{ document.addEventListener('click', outsideNotifClose); },0);
}
function outsideNotifClose(e){
  const panel=document.getElementById('notifPanel');
  if(panel && !panel.contains(e.target) && !e.target.closest('#notifBtn')){ panel.remove(); document.removeEventListener('click', outsideNotifClose); }
}

/* ================================================================
   EVENT DELEGATION
   ================================================================ */
function mainClickDelegate(e){
  const navBtn=e.target.closest('[data-action="nav"]');
  if(navBtn){ e.preventDefault(); const panel=document.getElementById('notifPanel'); if(panel) panel.remove(); showPage(navBtn.dataset.page); closeDrawer(); return; }

  let el;
  if((el=e.target.closest('[data-action="open-tx"]'))){ const t=STATE.transactions.find(x=>x.id===el.dataset.id); if(t) openTxDrawer(t); return; }
  if((el=e.target.closest('[data-action="open-settlement"]'))){ const s=STATE.settlements.find(x=>x.id===el.dataset.id); if(s) openSettlementDrawer(s); return; }
  if((el=e.target.closest('[data-action="open-invoice"]'))){ const i=STATE.invoices.find(x=>x.id===el.dataset.id); if(i) openInvoiceDrawer(i); return; }
  if((el=e.target.closest('[data-action="open-customer"]'))){ openCustomerDrawer(el.dataset.phone); return; }
  if((el=e.target.closest('[data-action="open-ticket"]'))){ openTicketDrawer(el.dataset.id); return; }

  if(e.target.closest('[data-action="close-drawer"]')){ closeDrawer(); return; }
  if(e.target.id==='drawerOverlay'){ closeDrawer(); return; }
  if(e.target.closest('[data-action="close-modal"]')){ closeModal(); return; }
  if(e.target.id==='modalCenter'){ closeModal(); return; }

  // Transactions / refunds
  if((el=e.target.closest('[data-action="refund-tx"]'))){ doRefundTx(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="download-receipt"]'))){ doDownloadReceipt(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="download-statement"]'))){ doDownloadStatement(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="export-tx"]'))){ doExportTx(el.dataset.fmt); return; }

  // Payment links
  if(e.target.closest('[data-action="new-link"]')){ doNewLink(); return; }
  if((el=e.target.closest('[data-action="copy-link"]'))){ doCopyLink(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="disable-link"]'))){ doDisableLink(el.dataset.id); return; }

  // Invoices
  if(e.target.closest('[data-action="new-invoice"]')){ doNewInvoice(); return; }
  if((el=e.target.closest('[data-action="send-invoice"]'))){ doSendInvoice(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="copy-invoice-link"]'))){ doCopyInvoiceLink(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="download-invoice-pdf"]'))){ doDownloadInvoicePdf(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="cancel-invoice"]'))){ doCancelInvoice(el.dataset.id); return; }

  // Reports
  if((el=e.target.closest('[data-action="download-report"]'))){ doDownloadReport(el.dataset.report); return; }

  // Support
  if(e.target.closest('[data-action="new-ticket"]')){ doNewTicket(); return; }

  // Business / bank account
  if(e.target.closest('[data-action="edit-business"]')){ doEditBusiness(); return; }
  if(e.target.closest('[data-action="request-bank-change"]')){ doRequestBankChange(); return; }

  // Team
  if(e.target.closest('[data-action="invite-team"]')){ doInviteTeam(); return; }
  if((el=e.target.closest('[data-action="team-role"]'))){ doTeamRoleChange(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="team-remove"]'))){ doTeamRemove(el.dataset.id); return; }

  // Developers
  if((el=e.target.closest('[data-action="reveal-key"]'))){ doRevealKey(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="copy-key"]'))){ doCopyKey(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="regenerate-key"]'))){ doRegenerateKey(el.dataset.id); return; }
  if(e.target.closest('[data-action="add-webhook"]')){ doAddWebhook(); return; }
  if((el=e.target.closest('[data-action="test-webhook"]'))){ doTestWebhook(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="disable-webhook"]'))){ doDisableWebhook(el.dataset.id); return; }

  // Notifications
  if(e.target.closest('[data-action="mark-all-read"]')){ STATE.notifications.forEach(n=>n.read=true); refreshPage(); toast('Barchasi o\u2018qilgan deb belgilandi','ok'); return; }
  if((el=e.target.closest('[data-action="read-notif"]'))){ const n=STATE.notifications[parseInt(el.dataset.idx,10)]; if(n){ n.read=true; refreshPage(); } return; }

  // Security
  if(e.target.closest('[data-action="change-password"]')){ doChangePassword(); return; }
  if(e.target.closest('[data-action="toggle-2fa"]')){ doToggle2FA(); return; }
  if((el=e.target.closest('[data-action="revoke-session"]'))){ doRevokeSession(el.dataset.id); return; }

  if((el=e.target.closest('[data-action="page"]'))){ const key=el.dataset.key; const f=getFilter(key); f.page+=parseInt(el.dataset.dir,10); refreshPage(); return; }
}
function mainInputDelegate(e){
  if(e.target.matches('[data-action="search"]')){
    const key=e.target.dataset.key; const val=e.target.value;
    const f=getFilter(key); f.search=val; f.page=1;
    refreshPage();
    const ni=document.querySelector('[data-action="search"][data-key="'+key+'"]');
    if(ni){ ni.focus(); const p=val.length; try{ni.setSelectionRange(p,p);}catch(err){} }
  }
}
function mainChangeDelegate(e){
  if(e.target.matches('[data-action="filter-status"]')){
    const key=e.target.dataset.key; const f=getFilter(key); f.status=e.target.value; f.page=1; refreshPage();
  }
  if(e.target.matches('[data-action="filter-method"]')){
    const key=e.target.dataset.key; const f=getFilter(key); f.method=e.target.value; f.page=1; refreshPage();
  }
  if(e.target.matches('[data-action="sort-tx"]')){
    const key=e.target.dataset.key; const f=getFilter(key); f.sort=e.target.value; refreshPage();
  }
  if(e.target.matches('[data-action="toggle-notif-setting"]')){
    const ch=e.target.dataset.ch, ev=e.target.dataset.ev;
    STATE.notifSettings[ch][ev]=e.target.checked;
    toast('Bildirishnoma sozlamasi yangilandi','ok');
  }
}

/* ================================================================
   INIT
   ================================================================ */
function initChrome(){
  document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const panel=document.getElementById('notifPanel'); if(panel) panel.remove(); showPage(btn.dataset.page); });
  });
  document.getElementById('collapseBtn').addEventListener('click', function(){
    STATE.sidebarCollapsed=!STATE.sidebarCollapsed;
    document.getElementById('sidebar').classList.toggle('collapsed', STATE.sidebarCollapsed);
  });
  document.getElementById('notifBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleNotifPanel(); });
  document.getElementById('globalSearch').addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const q=e.target.value.trim(); if(!q) return;
    const ql=q.toLowerCase();
    let tx=STATE.transactions.find(t=>t.id.toLowerCase()===ql || t.orderId.toLowerCase()===ql || t.customerName.toLowerCase().includes(ql));
    if(tx){ openTxDrawer(tx); return; }
    let inv=STATE.invoices.find(i=>i.number.toLowerCase()===ql || i.customerName.toLowerCase().includes(ql));
    if(inv){ openInvoiceDrawer(inv); return; }
    let lnk=STATE.links.find(l=>l.id.toLowerCase()===ql || l.title.toLowerCase().includes(ql));
    if(lnk){ showPage('links'); return; }
    let cust=STATE.customers.find(c=>c.name.toLowerCase().includes(ql) || c.phone.includes(q) || c.email.toLowerCase().includes(ql));
    if(cust){ openCustomerDrawer(cust.phone); return; }
    let st=STATE.settlements.find(s=>s.id.toLowerCase()===ql || (s.reference&&s.reference.toLowerCase()===ql));
    if(st){ openSettlementDrawer(st); return; }
    toast('"'+q+'" bo\u2018yicha natija topilmadi','err');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); document.getElementById('globalSearch').focus(); }
    if(e.key==='Escape'){ closeDrawer(); closeModal(); }
  });
  document.addEventListener('click', mainClickDelegate);
  document.addEventListener('input', mainInputDelegate);
  document.addEventListener('change', mainChangeDelegate);
}
document.addEventListener('DOMContentLoaded', function(){
  initData();
  window.STATE=STATE;
  initChrome();
  showPage('dashboard');
});
</script>
