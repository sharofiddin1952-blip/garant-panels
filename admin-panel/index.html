<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garant Acquiring &mdash; Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#F5F6F9;
  --surface:#FFFFFF;
  --surface-alt:#FAFBFC;
  --border:#E2E5EC;
  --border-strong:#CBD2DE;
  --text-1:#0F1522;
  --text-2:#4B5468;
  --text-3:#8A93A3;
  --blue:#2C4CE0;
  --blue-dark:#1E37AE;
  --blue-bg:#EAEEFC;
  --green:#157A4A;
  --green-bg:#E4F5EC;
  --red:#B3261E;
  --red-bg:#FCEAE9;
  --amber:#A15C00;
  --amber-bg:#FCEFDD;
  --purple:#6339B8;
  --purple-bg:#F0EBFB;
  --navy-1:#0B1220;
  --navy-2:#121B2E;
  --navy-3:#1B2740;
  --navy-text:#C9D2E3;
  --navy-text-dim:#7C8AA6;
  --radius-lg:10px;
  --radius-md:7px;
  --radius-sm:4px;
  --shadow-sm:0 1px 2px rgba(15,21,34,0.06);
  --shadow-md:0 4px 16px rgba(15,21,34,0.10);
  --shadow-lg:0 12px 40px rgba(15,21,34,0.16);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text-1);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CBD2DE;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#9AA4B8;}
a{color:var(--blue);text-decoration:none;}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.mono{font-family:var(--mono);}
.tabular{font-variant-numeric:tabular-nums;}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell{
  display:flex;
  height:100vh;
  width:100vw;
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:236px;
  min-width:236px;
  background:var(--navy-1);
  color:var(--navy-text);
  display:flex;
  flex-direction:column;
  transition:width .18s ease, min-width .18s ease;
  overflow:hidden;
  z-index:40;
}
.sidebar.collapsed{width:64px;min-width:64px;}
.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:18px 18px 16px 18px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
  white-space:nowrap;
}
.sidebar-brand .mark{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(160deg,#3E63FF,#2C4CE0);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sidebar-brand .mark svg{width:16px;height:16px;}
.sidebar-brand .name{font-weight:700;color:#fff;font-size:14.5px;letter-spacing:.1px;}
.sidebar-brand .sub{font-size:10.5px;color:var(--navy-text-dim);margin-top:1px;}
.sidebar.collapsed .brand-text{display:none;}

.sidebar-scroll{flex:1;overflow-y:auto;padding:10px 10px 12px 10px;}
.nav-section-label{
  font-size:10.5px;
  color:var(--navy-text-dim);
  padding:14px 10px 6px 10px;
  font-weight:600;
  letter-spacing:.2px;
}
.sidebar.collapsed .nav-section-label{display:none;}
.nav-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 10px;
  border-radius:var(--radius-md);
  color:var(--navy-text);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  margin-bottom:1px;
  position:relative;
  white-space:nowrap;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(46,86,255,0.18);color:#fff;}
.nav-item.active::before{
  content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;
  background:#4C6CFF;border-radius:0 3px 3px 0;
}
.nav-item .badge{
  margin-left:auto;
  background:rgba(255,255,255,0.1);
  color:var(--navy-text);
  font-size:10.5px;
  padding:1px 6px;
  border-radius:20px;
  font-weight:600;
}
.nav-item.danger .badge{background:var(--red);color:#fff;}
.sidebar.collapsed .nav-item .label,
.sidebar.collapsed .nav-item .badge{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}

.sidebar-footer{
  border-top:1px solid rgba(255,255,255,0.07);
  padding:10px;
  flex-shrink:0;
}
.collapse-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:8px 10px;border-radius:var(--radius-md);
  background:transparent;border:none;color:var(--navy-text-dim);font-size:12.5px;
}
.collapse-btn:hover{background:rgba(255,255,255,0.06);color:#fff;}
.collapse-btn svg{width:15px;height:15px;}

/* ---------- MAIN COLUMN ---------- */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}

/* ---------- TOPBAR ---------- */
.topbar{
  height:56px;
  min-height:56px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  flex-shrink:0;
  z-index:30;
}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-alt);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:7px 11px;
  width:360px;
  color:var(--text-3);
}
.search-box:focus-within{border-color:var(--blue);background:var(--surface);}
.search-box svg{width:14px;height:14px;flex-shrink:0;}
.search-box input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--text-1);}
.search-box .kbd{
  font-size:10.5px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;font-family:var(--mono);
}
.topbar-spacer{flex:1;}
.env-toggle{
  display:flex;background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:2px;
}
.env-toggle button{
  border:none;background:transparent;padding:5px 12px;border-radius:18px;font-size:12px;font-weight:600;color:var(--text-3);
}
.env-toggle button.active{background:var(--navy-1);color:#fff;}
.env-toggle button.active.sandbox{background:var(--amber);color:#fff;}
.topbar-icon-btn{
  position:relative;
  width:34px;height:34px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;color:var(--text-2);
}
.topbar-icon-btn:hover{background:var(--surface-alt);border-color:var(--border);}
.topbar-icon-btn svg{width:17px;height:17px;}
.dot-badge{
  position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);
  border:1.5px solid var(--surface);
}
.health-pill{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:20px;background:var(--green-bg);color:var(--green);font-size:12px;font-weight:600;
}
.health-pill .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative;}
.health-pill .pulse::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;background:var(--green);opacity:.35;
  animation:pulse 1.8s infinite;
}
@keyframes pulse{0%{transform:scale(0.6);opacity:.5;}70%{transform:scale(2.1);opacity:0;}100%{opacity:0;}}
.user-chip{
  display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface);
}
.user-chip .avatar{
  width:27px;height:27px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.user-chip .who{line-height:1.15;}
.user-chip .who .n{font-weight:600;font-size:12.5px;}
.user-chip .who .r{font-size:10.5px;color:var(--text-3);}

/* ---------- CONTENT ---------- */
.content-wrap{flex:1;display:flex;overflow:hidden;}
.page-scroll{flex:1;overflow-y:auto;padding:22px 26px 40px 26px;}
.page{display:none;}
.page.active{display:block;animation:fadein .15s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

.page-header{
  display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;
}
.page-header h1{font-size:21px;font-weight:700;margin:0 0 4px 0;letter-spacing:-.2px;}
.page-header .desc{color:var(--text-2);font-size:13px;max-width:640px;}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.breadcrumb a{color:var(--text-2);font-weight:500;}
.header-actions{display:flex;gap:8px;flex-shrink:0;}

.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);
  padding:8px 14px;border-radius:var(--radius-md);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--surface-alt);border-color:var(--text-3);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn-danger:hover{background:#8f1e18;border-color:#8f1e18;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 15px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.kpi-card .label{font-size:11.5px;color:var(--text-2);font-weight:600;}
.kpi-card .value{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.kpi-card .delta{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:3px;}
.kpi-card .delta.up{color:var(--green);}
.kpi-card .delta.down{color:var(--red);}
.kpi-card .delta svg{width:11px;height:11px;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px;align-items:start;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.grid-main-side{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start;}

.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px 16px 14px 16px;
}
.panel-title{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.panel-title h3{font-size:13.5px;font-weight:700;margin:0;}
.panel-title .sub{font-size:11.5px;color:var(--text-3);font-weight:500;}
.chart-wrap{position:relative;height:230px;}
.chart-wrap.sm{height:170px;}

/* Alerts panel (right) */
.alert-item{
  display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;
}
.alert-item:last-child{border-bottom:none;}
.alert-item:hover{background:var(--surface-alt);margin:0 -8px;padding:10px 8px;border-radius:6px;}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.alert-dot.critical{background:var(--red);}
.alert-dot.warn{background:var(--amber);}
.alert-dot.info{background:var(--blue);}
.alert-item .txt{font-size:12.5px;font-weight:500;line-height:1.35;}
.alert-item .meta{font-size:11px;color:var(--text-3);margin-top:2px;}

/* live command strip */
.live-strip{
  display:flex;align-items:stretch;gap:0;background:var(--navy-1);border-radius:var(--radius-lg);
  padding:0;margin-bottom:16px;overflow:hidden;color:#fff;
}
.live-strip .seg{padding:13px 20px;flex:1;border-right:1px solid rgba(255,255,255,0.08);}
.live-strip .seg:last-child{border-right:none;}
.live-strip .seg .l{font-size:10.5px;color:var(--navy-text-dim);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.live-strip .seg .v{font-size:18px;font-weight:700;font-family:var(--mono);}
.live-strip .seg .v small{font-size:11px;color:var(--navy-text-dim);font-family:var(--sans);font-weight:500;margin-left:4px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#37D67A;}

/* Tables */
.table-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.tbl-search{
  display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--radius-md);
  padding:6px 10px;background:var(--surface-alt);min-width:230px;
}
.tbl-search svg{width:13px;height:13px;color:var(--text-3);}
.tbl-search input{border:none;background:transparent;outline:none;width:100%;font-size:12.5px;}
.select-filter{
  border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 9px;background:var(--surface);
  font-size:12.5px;color:var(--text-1);font-weight:500;
}
.tbl-count{font-size:12px;color:var(--text-3);margin-left:auto;font-weight:500;}

.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{
  text-align:left;font-weight:600;color:var(--text-2);font-size:11.5px;
  padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-alt);
  white-space:nowrap;position:sticky;top:0;
}
.data-table tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.data-table tbody tr{cursor:pointer;}
.data-table tbody tr:hover{background:var(--surface-alt);}
.data-table .num{text-align:right;font-family:var(--mono);}
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);}
.table-scroll .data-table{border:none;}
.table-scroll thead th:first-child, .table-scroll tbody td:first-child{padding-left:16px;}

.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;font-size:11px;font-weight:600;
  white-space:nowrap;
}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.blue{background:var(--blue-bg);color:var(--blue);}
.badge.purple{background:var(--purple-bg);color:var(--purple);}
.badge.gray{background:#EDEFF3;color:var(--text-2);}
.badge .dotb{width:5px;height:5px;border-radius:50%;background:currentColor;}

.mini-bar{width:60px;height:5px;border-radius:3px;background:#EDEFF3;overflow:hidden;display:inline-block;vertical-align:middle;}
.mini-bar > span{display:block;height:100%;border-radius:3px;}

.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--text-3);border-top:1px solid var(--border);}
.pager-btns{display:flex;gap:6px;}
.pager-btns button{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);}
.pager-btns button:hover{background:var(--surface-alt);}
.pager-btns button:disabled{opacity:.4;cursor:not-allowed;}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab-btn{
  padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-3);background:none;border:none;
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tab-btn:hover{color:var(--text-1);}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-3);text-align:center;
}
.empty-state svg{width:36px;height:36px;margin-bottom:12px;opacity:.5;}
.empty-state .t{font-weight:600;color:var(--text-2);margin-bottom:4px;font-size:13px;}
.empty-state .d{font-size:12px;max-width:320px;}

/* Modal / drawer */
.overlay{
  position:fixed;inset:0;background:rgba(11,18,32,0.45);z-index:100;display:none;align-items:stretch;justify-content:flex-end;
}
.overlay.open{display:flex;}
.drawer{
  width:620px;max-width:92vw;background:var(--surface);height:100%;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:slidein .18s ease;
}
@keyframes slidein{from{transform:translateX(24px);opacity:.6;}to{transform:translateX(0);opacity:1;}}
.drawer-head{
  padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;
}
.drawer-head h2{font-size:16px;margin:0 0 3px 0;font-weight:700;}
.drawer-head .sub{font-size:12px;color:var(--text-3);}
.drawer-close{width:30px;height:30px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--text-2);flex-shrink:0;}
.drawer-close:hover{background:var(--surface-alt);}
.drawer-close svg{width:16px;height:16px;}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px;}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}

.modal-center{position:fixed;inset:0;background:rgba(11,18,32,0.45);z-index:110;display:none;align-items:center;justify-content:center;}
.modal-center.open{display:flex;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:440px;max-width:92vw;box-shadow:var(--shadow-lg);padding:22px;animation:popin .12s ease;}
@keyframes popin{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-box h3{margin:0 0 8px 0;font-size:15px;font-weight:700;}
.modal-box p{margin:0 0 16px 0;color:var(--text-2);font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}

.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.kv{border-bottom:1px solid var(--border);padding-bottom:9px;}
.kv .k{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:3px;}
.kv .v{font-size:13px;font-weight:600;}
.kv .v.mono{font-family:var(--mono);font-size:12px;font-weight:500;}
.section-h{font-size:12px;font-weight:700;color:var(--text-2);margin:20px 0 10px 0;text-transform:none;letter-spacing:0;}
.section-h:first-child{margin-top:0;}

/* Timeline */
.tl{position:relative;padding-left:22px;}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--border);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:'';position:absolute;left:-22px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--blue);
  border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--blue);
}
.tl-item.done::before{background:var(--green);box-shadow:0 0 0 1.5px var(--green);}
.tl-item.failed::before{background:var(--red);box-shadow:0 0 0 1.5px var(--red);}
.tl-item .tt{font-size:12.5px;font-weight:700;}
.tl-item .td{font-size:11.5px;color:var(--text-3);margin-top:2px;}

.progress-bar-outer{height:8px;background:#EDEFF3;border-radius:5px;overflow:hidden;}
.progress-bar-inner{height:100%;border-radius:5px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy-1);color:#fff;padding:12px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);
  font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:260px;animation:toastin .18s ease;
}
@keyframes toastin{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast svg{width:15px;height:15px;flex-shrink:0;}
.toast.ok svg{color:#37D67A;}
.toast.err svg{color:#FF6B5E;}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{
  width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:8px 10px;font-size:13px;background:var(--surface);
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--blue);outline:none;}
.form-hint{font-size:11.5px;color:var(--text-3);margin-top:4px;}

.deadline-chip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;}
.deadline-chip.ok{background:var(--green-bg);color:var(--green);}
.deadline-chip.soon{background:var(--amber-bg);color:var(--amber);}
.deadline-chip.late{background:var(--red-bg);color:var(--red);}

.matrix-table th,.matrix-table td{text-align:center;}
.matrix-table td:first-child,.matrix-table th:first-child{text-align:left;}
.chk{width:15px;height:15px;accent-color:var(--blue);}

/* ============================================================
   MERCHANT 360 PROFILE
   ============================================================ */
.m360-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px;}
.m360-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.m360-title-row h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px;}
.m360-back{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-size:12px;font-weight:600;margin-bottom:8px;background:none;border:none;padding:0;}
.m360-back:hover{color:var(--blue);}
.m360-back svg{width:13px;height:13px;}
.m360-meta{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0 16px 0;font-size:12px;color:var(--text-3);}
.m360-meta b{color:var(--text-1);font-weight:600;}
.m360-menu-wrap{position:relative;flex-shrink:0;}
.m360-dropdown{position:absolute;top:40px;right:0;width:258px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:95;padding:6px;}
.m360-dropdown button{display:flex;width:100%;text-align:left;padding:9px 10px;border-radius:6px;font-size:12.5px;font-weight:500;background:none;border:none;color:var(--text-1);gap:9px;align-items:center;}
.m360-dropdown button:hover{background:var(--surface-alt);}
.m360-dropdown button.danger{color:var(--red);}
.m360-dropdown button svg{width:14px;height:14px;flex-shrink:0;color:var(--text-3);}
.m360-dropdown hr{border:none;border-top:1px solid var(--border);margin:5px 2px;}
.actions-banner{border:1px solid var(--red);border-left:3px solid var(--red);border-radius:var(--radius-lg);background:var(--red-bg);padding:12px 16px;margin-bottom:16px;}
.actions-banner.amber{border-color:var(--amber);border-left-color:var(--amber);background:var(--amber-bg);}
.actions-banner .ab-title{font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--text-1);}
.actions-banner .ab-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;color:var(--text-1);}
.cap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.cap-chip{border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 11px;cursor:pointer;background:var(--surface);}
.cap-chip:hover{border-color:var(--border-strong);background:var(--surface-alt);}
.cap-chip .cn{font-size:11.5px;font-weight:600;margin-bottom:5px;color:var(--text-1);}
.health-card{display:flex;align-items:center;gap:18px;}
.health-ring{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.health-ring-inner{width:49px;height:49px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.health-bars{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.health-bars .hb .l{color:var(--text-3);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;font-size:10.5px;}
.line-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.line-item:last-child{border-bottom:none;}
.m360-subnote{font-size:11px;color:var(--text-3);margin-top:10px;}
.period-toggle{display:flex;gap:2px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:2px;}
.period-toggle button{border:none;background:none;padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--text-2);border-radius:5px;}
.period-toggle button.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm);}
.owner-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;background:var(--surface);}
.avatar-circle{width:34px;height:34px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}

.notif-dropdown, .env-note{display:none;}

@media (max-width:1400px){
  .kpi-grid{grid-template-columns:repeat(3,1fr);}
  .grid-main-side{grid-template-columns:1fr;}
}

   ================================================================ */
function rnd(min,max){return Math.random()*(max-min)+min;}
function rndInt(min,max){return Math.floor(rnd(min,max+1));}
function pick(arr){return arr[rndInt(0,arr.length-1)];}
function pickW(items){ // items: [[value,weight],...]
  const total=items.reduce((s,i)=>s+i[1],0); let r=rnd(0,total);
  for(const [v,w] of items){ if(r<w) return v; r-=w; }
  return items[0][0];
}
function uid(prefix,n){return prefix+'-'+String(n).padStart(5,'0');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function fmtMoney(amount,currency){
  const abs=Math.round(amount);
  let s=Math.abs(abs).toLocaleString('ru-RU').replace(/,/g,' ');
  const sign=amount<0?'-':'';
  const symbols={UZS:"so'm",USD:'$',EUR:'\u20ac'};
  if(currency==='USD') return sign+'$'+s;
  if(currency==='EUR') return sign+'\u20ac'+s;
  return sign+s+" so'm";
}
function fmtCompact(n){
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2)+' mlrd';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+' mln';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(0)+' ming';
  return String(Math.round(n));
}
function fmtDate(d){
  const dt=(d instanceof Date)?d:new Date(d);
  return dt.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(d){
  const dt=(d instanceof Date)?d:new Date(d);
  return fmtDate(dt)+' '+dt.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
}
function relTime(d){
  const dt=(d instanceof Date)?d:new Date(d);
  const diff=Math.floor((Date.now()-dt.getTime())/1000);
  if(diff<60) return diff+'s oldin';
  if(diff<3600) return Math.floor(diff/60)+' daq oldin';
  if(diff<86400) return Math.floor(diff/3600)+' soat oldin';
  return Math.floor(diff/86400)+' kun oldin';
}
function daysBetween(a,b){return Math.ceil((b.getTime()-a.getTime())/86400000);}
function daysAgo(n){return new Date(Date.now()-n*86400000-rndInt(0,80000)*1000);}
function daysFromNow(n){return new Date(Date.now()+n*86400000);}

function badge(text){ const c=STATUS_COLOR[text]||'gray'; return '<span class="badge '+c+'"><span class="dotb"></span>'+esc(text)+'</span>'; }
function badgeC(text,color){ return '<span class="badge '+color+'"><span class="dotb"></span>'+esc(text)+'</span>'; }
function deadlineBadge(deadline){
  const d=daysBetween(new Date(),deadline);
  let cls='ok', txt=d+' kun qoldi';
  if(d<0){cls='late';txt=Math.abs(d)+' kun kechikdi';}
  else if(d<=3){cls='soon';txt=d+' kun qoldi';}
  return '<span class="deadline-chip '+cls+'">'+txt+'</span>';
}
function paginate(arr,page,pageSize){
  const total=arr.length, totalPages=Math.max(1,Math.ceil(total/pageSize));
  page=clamp(page,1,totalPages);
  const start=(page-1)*pageSize;
  return {rows:arr.slice(start,start+pageSize), page, totalPages, total, shown:Math.min(pageSize,total-start)};
}
function getFilter(key,defaults){
  if(!STATE.filters[key]) STATE.filters[key]=Object.assign({search:'',status:'all',page:1,pageSize:8},defaults||{});
  return STATE.filters[key];
}
function pagerHTML(key,p){
  return '<div class="pager"><div>'+p.total+' ta yozuvdan '+((p.page-1)*8+1)+'\u2013'+((p.page-1)*8+p.rows.length)+' ko\u2018rsatilmoqda</div>'+
    '<div class="pager-btns">'+
    '<button data-action="page" data-key="'+key+'" data-dir="-1" '+(p.page<=1?'disabled':'')+'><svg style="width:13px;height:13px"><use href="#i-chevron-l"/></svg></button>'+
    '<button data-action="page" data-key="'+key+'" data-dir="1" '+(p.page>=p.totalPages?'disabled':'')+' style="transform:scaleX(-1)"><svg style="width:13px;height:13px"><use href="#i-chevron-l"/></svg></button>'+
    '</div></div>';
}
function toolbarHTML(key,placeholder,statusOptions){
  const f=getFilter(key);
  let html='<div class="table-toolbar">';
  html+='<div class="tbl-search"><svg><use href="#i-search"/></svg><input type="text" data-action="search" data-key="'+key+'" placeholder="'+placeholder+'" value="'+esc(f.search)+'"></div>';
  if(statusOptions){
    html+='<select class="select-filter" data-action="filter-status" data-key="'+key+'">';
    html+='<option value="all">Barcha holatlar</option>';
    statusOptions.forEach(o=>{ html+='<option value="'+esc(o)+'" '+(f.status===o?'selected':'')+'>'+esc(o)+'</option>'; });
    html+='</select>';
  }
  html+='<span class="tbl-count" id="cnt-'+key+'"></span>';
  html+='</div>';
  return html;
}
function applySearch(rows,search,fields){
  if(!search) return rows;
  const s=search.toLowerCase();
  return rows.filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(s)));
}
function riskDotColor(score){ return score>=71?'red':score>=31?'amber':'green'; }

function computeKPIs(){
  const tx=STATE.transactions;
  const approved=tx.filter(t=>t.status==='Muvaffaqiyatli');
  const totalVol=approved.reduce((s,t)=>s+ (t.currency==='UZS'?t.amount:t.amount*12800), 0);
  const approvalRate= tx.length? (approved.length/tx.length*100):0;
  const declineRate=100-approvalRate;
  const refundVol=STATE.refunds.filter(r=>r.status==='Bajarildi').reduce((s,r)=>s+r.amount,0);
  const cbRate= approved.length? (STATE.chargebacks.length/approved.length*100):0;
  const settleAmt=STATE.settlements.filter(s=>s.status==='Amalga oshirildi').reduce((s,x)=>s+x.net,0);
  const mdrRevenue=Math.round(totalVol*0.018);
  const activeMerchants=STATE.merchants.filter(m=>m.status==='Faol').length;
  return {totalVol,txCount:tx.length,approvalRate,declineRate,refundVol,cbRate,settleAmt,mdrRevenue,activeMerchants,activeMids:activeMerchants};
}

function getMerchantProfile(m){
  if(STATE.merchantProfiles[m.id]) return STATE.merchantProfiles[m.id];
  const mTx = STATE.transactions.filter(t=>t.merchantId===m.id);
  const approvedTx = mTx.filter(t=>t.status==='Muvaffaqiyatli');
  const gmv = approvedTx.reduce((s,t)=>s+t.amount,0);

  // ---- Owners / representatives ----
  const ownerCount=rndInt(1,3);
  const owners=[]; let remainPct=100;
  for(let i=0;i<ownerCount;i++){
    const pct = i===ownerCount-1? remainPct : rndInt(15,Math.max(16,remainPct-15));
    remainPct-=pct;
    owners.push({
      id:uid('OWN',i+1),
      name:pick(FIRST_NAMES)+' '+pick(LAST_NAMES),
      position: i===0?'Direktor':pick(['Ta\u2018sischi','Moliya direktori','Aksiyador']),
      ownershipPct:pct, country:'O\u2018zbekiston',
      kycStatus:pickW([['Tasdiqlangan',80],['Kutilmoqda',15],['Rad etilgan',5]]),
      addedDate:daysAgo(rndInt(30,500)),
    });
  }

  // ---- Bank accounts ----
  const bankNames=['Kapital Bank','Ipoteka Bank','Xalq Banki','Asaka Bank','Garant Bank'];
  const bankAccounts=[]; const baCount=rndInt(1,2);
  for(let i=0;i<baCount;i++){
    bankAccounts.push({
      id:uid('BA',i+1), bank: i===0?'Garant Bank':pick(bankNames),
      accountName:m.legalName, accountNumberMasked:'**** '+rndInt(1000,9999),
      currency:'UZS', status: i===0?'Tasdiqlangan':pickW([['Tasdiqlangan',70],['Kutilmoqda',30]]),
      primary:i===0,
    });

  // ---- MIDs & acquiring ----

  for(let i=0;i<midCount;i++){
    const acq=pick(STATE.acquirers);

    {date:daysAgo(rndInt(380,419)),user:'Merchant',action:'Hujjatlar yuklandi',result:'To\u2018liq'},

  const webhooks=[
    {id:'MWH-1', endpoint:'https://api.'+hostShort+'/webhooks/garant', event:'payment.succeeded', status:'Faol', lastDelivery:daysAgo(0), httpStatus:200, retryCount:0},
    {id:'MWH-2', endpoint:'https://api.'+hostShort+'/webhooks/garant', event:'refund.completed', status:'Faol', lastDelivery:daysAgo(1), httpStatus:200, retryCount:0},
    {id:'MWH-3', endpoint:'https://api.'+hostShort+'/webhooks/garant', event:'chargeback.created', status: Math.random()<0.25?'Xatolik':'Faol', lastDelivery:daysAgo(0), httpStatus: Math.random()<0.25?504:200, retryCount: Math.random()<0.25?3:0},
  ];
  const apiLogs=[];
  for(let i=0;i<10;i++){
    const ok=Math.random()<0.86;
    apiLogs.push({
      requestId:'req_'+Math.random().toString(36).slice(2,10),
      endpoint:pick(['/v1/payments','/v1/refunds','/v1/payments/status','/v1/webhooks/test']),
      method:pick(['POST','GET']), timestamp:daysAgo(rndInt(0,5)),
      response: ok?200:pick([400,401,500,504]), latency:rndInt(80,650),
    });
  }
  apiLogs.sort((a,b)=>b.timestamp-a.timestamp);

  // ---- Merchant users ----
  const roles=['Owner','Moliya','Operatsiya','Dasturchi','Kuzatuvchi'];
  const merchantUsers=[]; const uCount=rndInt(2,5);
  for(let i=0;i<uCount;i++){
    const fn=pick(FIRST_NAMES), ln=pick(LAST_NAMES);
    merchantUsers.push({
      id:uid('MU',i+1), name:fn+' '+ln,
      email:fn.toLowerCase()+'.'+ln.toLowerCase()+'@'+hostShort,
      role: i===0?'Owner':pick(roles.slice(1)),
      status: i===0?'Faol':pickW([['Faol',72],['Taklif yuborilgan',16],['To\u2018xtatilgan',12]]),
      lastLogin:daysAgo(rndInt(0,20)), created:daysAgo(rndInt(30,400)),
    });
  }

  // ---- Support tickets ----
  const tickets=[]; const tCount=rndInt(0,4);
  const subjects=['Settlement kechikmoqda','API integratsiya bo\u2018yicha savol','Webhook yetkazilmayapti','Komissiya stavkasi bo\u2018yicha savol','Hisobotda nomuvofiqlik','Yangi MID ochish so\u2018rovi'];
  for(let i=0;i<tCount;i++){
    tickets.push({
      id:uid('SUP',i+1), subject:pick(subjects),
      priority:pickW([['Past',38],['O\u2018rta',36],['Yuqori',18],['Kritik',8]]),
      status:pickW([['Yangi',28],['Jarayonda',42],['Yopilgan',30]]),
      agent:pick(FIRST_NAMES)+' '+pick(LAST_NAMES), created:daysAgo(rndInt(0,20)), updated:daysAgo(rndInt(0,5)),
    });
  }

  // ---- Notes ----
  const notes=[];

  // ---- Health score ----
  const compliance = documents.filter(d=>d.status==='Tasdiqlangan').length>=6 ? rndInt(90,99) : rndInt(68,89);
  const paymentPerf = Math.round(m.approvalRate);
  const riskComp = Math.max(5,100-riskScore);
  const settlementComp = rndInt(84,99);
  const technicalComp = rndInt(78,98);
  const healthTotal = Math.round((compliance+paymentPerf+riskComp+settlementComp+technicalComp)/5);

  // ---- Actions required (derived) ----
  const actionsRequired=[];
  documents.forEach(d=>{
    if(d.expiry){
      const days=daysBetween(new Date(),d.expiry);
      if(days>=0 && days<=14) actionsRequired.push({level:'red', text:esc(d.name)+' muddati '+days+' kunda tugaydi'});
    }
    if(d.status==='Muddati o\u2018tgan') actionsRequired.push({level:'red', text:esc(d.name)+' muddati o\u2018tgan \u2014 yangilash talab qilinadi'});
  });
  if(m.chargebackRate>0.8) actionsRequired.push({level:'amber', text:'Chargeback nisbati chegaradan oshdi ('+m.chargebackRate.toFixed(2)+'%)'});
  const mReconEx=STATE.reconExceptions.filter(r=>r.merchantName===m.businessName && (r.status==='Ochiq'||r.status==='Tekshirilmoqda'));
  if(mReconEx.length) actionsRequired.push({level:'amber', text:'Moslashtirishda '+mReconEx.length+' ta yopilmagan istisno bor'});
  if(m.kycStatus==='Muddati o\u2018tgan') actionsRequired.push({level:'red', text:'KYC muddati o\u2018tgan \u2014 qayta tasdiqlash talab qilinadi'});
  if(riskScore>70) actionsRequired.push({level:'amber', text:'Risk balli yuqori ('+riskScore+'/100) \u2014 ko\u2018rib chiqish tavsiya etiladi'});

  const profile={
    owners, bankAccounts, mids, capabilities, kycTimeline, documents,
    riskScore, riskRulesTriggered, riskHistory, feeHistory, pricing, limits,
    payouts, apiProfile, webhooks, apiLogs, merchantUsers, tickets, notes,
    health:{total:healthTotal, compliance, paymentPerf, risk:riskComp, settlement:settlementComp, technical:technicalComp},
    actionsRequired, gmv,
  };
  STATE.merchantProfiles[m.id]=profile;
  return profile;
}

function m360TabOverview(m,p){
  const mTx=STATE.transactions.filter(t=>t.merchantId===m.id);
  const approved=mTx.filter(t=>t.status==='Muvaffaqiyatli');
  const declined=mTx.filter(t=>t.status==='Rad etilgan');
  const failed=mTx.filter(t=>t.status==='Muvaffaqiyatsiz');
  const pending=mTx.filter(t=>t.status==='Kutilmoqda');
  const refundVol=STATE.refunds.filter(r=>r.merchantId===m.id && r.status==='Bajarildi').reduce((s,r)=>s+r.amount,0);
  const cbVol=STATE.chargebacks.filter(c=>c.merchantId===m.id).reduce((s,c)=>s+c.amount,0);
  const pendingSettle=STATE.settlements.filter(s=>s.merchantId===m.id && (s.status==='Kutilmoqda'||s.status==='Jarayonda')).reduce((s,x)=>s+x.net,0);
  const netSettle=STATE.settlements.filter(s=>s.merchantId===m.id && s.status==='Amalga oshirildi').reduce((s,x)=>s+x.net,0);
  const approvalRate=mTx.length?(approved.length/mTx.length*100):m.approvalRate;
  const declineRate=100-approvalRate;

  const declineReasons={};
  mTx.filter(t=>t.status==='Rad etilgan'||t.status==='Muvaffaqiyatsiz').forEach(t=>{ declineReasons[t.responseMessage]=(declineReasons[t.responseMessage]||0)+1; });
  const drEntries=Object.entries(declineReasons).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const methodStats={};
  mTx.forEach(t=>{
    if(!methodStats[t.paymentMethod]) methodStats[t.paymentMethod]={count:0,vol:0,approved:0};
    methodStats[t.paymentMethod].count++; methodStats[t.paymentMethod].vol+=t.amount;
    if(t.status==='Muvaffaqiyatli') methodStats[t.paymentMethod].approved++;
  });
  const methodRows=Object.entries(methodStats).sort((a,b)=>b[1].vol-a[1].vol);
  const totalVol=methodRows.reduce((s,r)=>s+r[1].vol,0)||1;

  const acqStats={};
  mTx.forEach(t=>{
    if(!acqStats[t.acquirer]) acqStats[t.acquirer]={count:0,vol:0,approved:0,mid:t.mid};
    acqStats[t.acquirer].count++; acqStats[t.acquirer].vol+=t.amount;
    if(t.status==='Muvaffaqiyatli') acqStats[t.acquirer].approved++;
  });
  const acqRows=Object.entries(acqStats).sort((a,b)=>b[1].vol-a[1].vol);

  const periods=['24H','7D','30D','90D','1Y'];
  const metrics=['GMV','Tranzaksiyalar','Approval rate','O\u2018rtacha summa'];

  return `
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi-card"><div class="label">Qayta ishlash hajmi</div><div class="value">${fmtCompact(p.gmv)}</div><div class="delta up"><svg><use href="#i-arrow-up"/></svg>+14.8% o\u2018tgan davrga nisbatan</div></div>
    <div class="kpi-card"><div class="label">Tranzaksiyalar</div><div class="value">${mTx.length.toLocaleString('ru-RU')}</div></div>
    <div class="kpi-card"><div class="label">Approval rate</div><div class="value" style="color:var(--green)">${approvalRate.toFixed(1)}%</div></div>
    <div class="kpi-card"><div class="label">Decline rate</div><div class="value" style="color:var(--red)">${declineRate.toFixed(1)}%</div></div>
    <div class="kpi-card"><div class="label">Refund hajmi</div><div class="value">${fmtCompact(refundVol)}</div></div>
    <div class="kpi-card"><div class="label">Chargeback hajmi</div><div class="value">${fmtCompact(cbVol)}</div></div>
    <div class="kpi-card"><div class="label">Kutilayotgan settlement</div><div class="value">${fmtCompact(pendingSettle)}</div></div>
    <div class="kpi-card"><div class="label">Sof settlement</div><div class="value">${fmtCompact(netSettle)}</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="panel-title">
      <h3>Tranzaksiya hajmi dinamikasi</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="period-toggle">${periods.map(pr=>'<button data-action="m360-period" data-period="'+pr+'" class="'+(STATE.m360Period===pr?'active':'')+'">'+pr+'</button>').join('')}</div>
        <select class="select-filter" data-action="m360-metric-select">${metrics.map(me=>'<option '+(STATE.m360Metric===me?'selected':'')+'>'+me+'</option>').join('')}</select>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="m360ChartVolume"></canvas></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-title"><h3>To\u2018lov samaradorligi</h3></div>
      <div class="chart-wrap sm"><canvas id="m360ChartPerf"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-title"><h3>Rad etilish sabablari</h3></div>
      ${drEntries.length? drEntries.map(([reason,cnt])=>`<div class="line-item"><span>${esc(reason)}</span><span style="font-weight:700">${cnt}</span></div>`).join('') : '<div style="color:var(--text-3);font-size:12.5px;padding:8px 0">Rad etilgan tranzaksiya yo\u2018q</div>'}
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="panel-title"><h3>To\u2018lov usuli bo\u2018yicha taqsimot</h3></div>
    <div class="table-scroll" style="border:none"><table class="data-table"><thead><tr><th>Usul</th><th class="num">Hajm</th><th class="num">Ulush</th><th class="num">Tranzaksiya</th><th class="num">Approval</th><th class="num">O\u2018rtacha summa</th></tr></thead>
    <tbody>${methodRows.length? methodRows.map(([method,s])=>`<tr><td style="font-weight:600">${esc(method)}</td><td class="num">${fmtCompact(s.vol)}</td><td class="num">${(s.vol/totalVol*100).toFixed(1)}%</td><td class="num">${s.count}</td><td class="num">${(s.approved/s.count*100).toFixed(1)}%</td><td class="num">${fmtCompact(s.vol/s.count)}</td></tr>`).join('') : '<tr><td colspan="6" style="color:var(--text-3);padding:14px">Tranzaksiya topilmadi</td></tr>'}</tbody>
    </table></div>
  </div>

  <div class="panel">
    <div class="panel-title"><h3>Ekvayer samaradorligi</h3></div>
    <div class="table-scroll" style="border:none"><table class="data-table"><thead><tr><th>Ekvayer</th><th>MID</th><th class="num">Hajm</th><th class="num">Tranzaksiya</th><th class="num">Approval</th><th>Holat</th></tr></thead>
    <tbody>${acqRows.length? acqRows.map(([name,s])=>{
      const ar=s.approved/s.count*100; const st= ar>=95?'Sog\u2018lom':ar>=88?'Degradatsiya':'Kritik';
      return `<tr data-action="open-acquirer" data-id="${(STATE.acquirers.find(a=>a.name===name)||{}).id||''}"><td style="font-weight:600">${esc(name)}</td><td class="mono">${esc(s.mid)}</td><td class="num">${fmtCompact(s.vol)}</td><td class="num">${s.count}</td><td class="num">${ar.toFixed(1)}%</td><td>${badge(st)}</td></tr>`;
    }).join('') : '<tr><td colspan="6" style="color:var(--text-3);padding:14px">Ma\u2018lumot yo\u2018q</td></tr>'}</tbody>
    </table></div>
  </div>
  `;
}

  const pending=rows.filter(r=>r.status==='Kutilmoqda');
  const failed=rows.filter(r=>r.status==='Muvaffaqiyatsiz');
  const amount=done.reduce((s,r)=>s+r.amount,0);

function m360TabSettlements(m){

function m360TabReconciliation(m){
  const rows=STATE.reconExceptions.filter(r=>r.merchantName===m.businessName);
  const matched=STATE.transactions.filter(t=>t.merchantId===m.id).length - rows.length;
  const total=STATE.transactions.filter(t=>t.merchantId===m.id).length||1;
  const matchRate=(matched/total*100);
  const diff=rows.reduce((s,r)=>s+Math.abs(r.difference),0);
  return `
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi-card"><div class="label">Moslik darajasi</div><div class="value" style="color:var(--green)">${matchRate.toFixed(1)}%</div></div>
    <div class="kpi-card"><div class="label">Mos kelgan</div><div class="value">${matched.toLocaleString('ru-RU')}</div></div>
    <div class="kpi-card"><div class="label">Mos kelmagan</div><div class="value" style="color:var(--red)">${rows.length}</div></div>
    <div class="kpi-card"><div class="label">Moliyaviy farq</div><div class="value">${fmtCompact(diff)}</div></div>
  </div>
  <div class="table-scroll">
  <table class="data-table"><thead><tr><th>Istisno ID</th><th>Tranzaksiya</th><th class="num">Kutilgan</th><th class="num">Haqiqiy</th><th class="num">Farq</th><th>Manba</th><th>Sabab</th><th>Holat</th><th></th></tr></thead>
  <tbody>${rows.length? rows.map(r=>`<tr>
    <td class="mono">${r.id}</td><td class="mono" style="color:var(--text-2)">${r.transactionId}</td>
    <td class="num">${fmtMoney(r.expectedAmount,'UZS')}</td><td class="num">${fmtMoney(r.actualAmount,'UZS')}</td>
    <td class="num" style="color:${r.difference===0?'var(--text-2)':'var(--red)'}">${r.difference>0?'+':''}${fmtMoney(r.difference,'UZS')}</td>
    <td style="color:var(--text-2)">${esc(r.source)}</td><td style="color:var(--text-2)">${esc(r.reason)}</td><td>${badge(r.status)}</td>
    <td>${(r.status==='Ochiq'||r.status==='Tekshirilmoqda')? '<button class="btn btn-sm" data-action="match-exception" data-id="'+r.id+'">Moslashtirish</button>' : ''}</td>
  </tr>`).join('') : '<tr><td colspan="9" style="color:var(--text-3);padding:14px">Istisno topilmadi \u2014 barcha yozuvlar mos keladi</td></tr>'}</tbody>
  </table></div>`;
}

function m360TabMethods(m,p){
  const mTx=STATE.transactions.filter(t=>t.merchantId===m.id);
  const stats={};
  mTx.forEach(t=>{ if(!stats[t.paymentMethod]) stats[t.paymentMethod]={count:0,vol:0,approved:0}; stats[t.paymentMethod].count++; stats[t.paymentMethod].vol+=t.amount; if(t.status==='Muvaffaqiyatli') stats[t.paymentMethod].approved++; });
  return `
  <div class="table-scroll">
  <table class="data-table"><thead><tr><th>Usul</th><th>Holat</th><th class="num">Hajm</th><th class="num">Approval</th><th class="num">Komissiya</th><th>Ekvayer</th><th>Amallar</th></tr></thead>
  <tbody>${PAYMENT_METHODS.map(pm=>{
    const st=stats[pm]||{count:0,vol:0,approved:0};
    const cap = pm==='Uzcard'||pm==='Humo'? (p.capabilities[pm]||'Faol') : (p.capabilities[pm]||pickW([['Faol',70],['Faol emas',30]]));
    const ar= st.count? (st.approved/st.count*100).toFixed(1)+'%' : '\u2014';
    const fee = pm==='Visa'?p.pricing.Visa: pm==='Mastercard'?p.pricing.Mastercard: pm==='Humo'?p.pricing.Humo: pm==='Uzcard'?p.pricing.Uzcard : '1.80';
    return `<tr>
      <td style="font-weight:600">${esc(pm)}</td><td>${badge(cap)}</td>
      <td class="num">${fmtCompact(st.vol)}</td><td class="num">${ar}</td><td class="num">${fee}%</td>
      <td style="color:var(--text-2)">${esc((STATE.acquirers.find(a=>a.schemes.includes(pm))||{}).name||'\u2014')}</td>
      <td>${cap==='Faol'? '<button class="btn btn-sm" data-action="m360-toggle-cap" data-id="'+m.id+'" data-cap="'+pm+'">O\u2018chirish</button>' : '<button class="btn btn-sm" data-action="m360-toggle-cap" data-id="'+m.id+'" data-cap="'+pm+'">Yoqish</button>'}</td>
    </tr>`;
  }).join('')}</tbody>
  </table></div>`;
}

function renderMerchant360(){
  const m=STATE.merchants.find(x=>x.id===STATE.currentMerchantId) || STATE.merchants[0];
  if(!m) return '<div class="empty-state"><div class="t">Merchant topilmadi</div></div>';
  STATE.currentMerchantId=m.id;
  const p=getMerchantProfile(m);
  const active=STATE.currentMerchantTab||'overview';
  const panels=M360_TABS.map(function(pair){
    const key=pair[0]; const fn=M360_TAB_FN[key];
    const html= fn? fn(m,p) : '<div style="color:var(--text-3)">Tez orada</div>';
    return '<div data-tabpanel="'+key+'" data-group="m360" style="'+(key===active?'':'display:none')+'">'+html+'</div>';
  }).join('');

}
function paintM360Charts(){
  const m=STATE.merchants.find(x=>x.id===STATE.currentMerchantId); if(!m) return;
  const mTx=STATE.transactions.filter(t=>t.merchantId===m.id);
  const periodDays={'24H':1,'7D':7,'30D':30,'90D':90,'1Y':365}[STATE.m360Period]||30;
  const buckets= periodDays<=7? periodDays : Math.min(periodDays,30);
  const labels=[]; const values=[];
  for(let i=buckets-1;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);
    labels.push(d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit'}));
    const dayTx=mTx.filter(t=>t.createdAt.toDateString()===d.toDateString());
    let v=0;
    if(STATE.m360Metric==='Tranzaksiyalar') v=dayTx.length;
    else if(STATE.m360Metric==='Approval rate') v= dayTx.length? (dayTx.filter(t=>t.status==='Muvaffaqiyatli').length/dayTx.length*100) : 0;
    else if(STATE.m360Metric==='O\u2018rtacha summa') v= dayTx.length? (dayTx.reduce((s,t)=>s+t.amount,0)/dayTx.length/1000000) : 0;
    else v=dayTx.filter(t=>t.status==='Muvaffaqiyatli').reduce((s,t)=>s+t.amount,0)/1000000;
    values.push(v);
  }
  const ctxV=document.getElementById('m360ChartVolume');
  if(ctxV){
    charts.m360vol=new Chart(ctxV,{type:'line',data:{labels,datasets:[{label:STATE.m360Metric,data:values,borderColor:'#2C4CE0',backgroundColor:'rgba(44,76,224,0.08)',fill:true,tension:.35,pointRadius:0,borderWidth:2}]},
      options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:'#EEF0F4'},ticks:{font:{size:10.5}}},x:{grid:{display:false},ticks:{font:{size:10.5},maxRotation:0,autoSkip:true}}},maintainAspectRatio:false}});
  }
  const approved=mTx.filter(t=>t.status==='Muvaffaqiyatli').length;
  const declined=mTx.filter(t=>t.status==='Rad etilgan').length;
  const failed=mTx.filter(t=>t.status==='Muvaffaqiyatsiz').length;
  const pending=mTx.filter(t=>t.status==='Kutilmoqda').length;
  const ctxP=document.getElementById('m360ChartPerf');
  if(ctxP){
    charts.m360perf=new Chart(ctxP,{type:'doughnut',data:{labels:['Tasdiqlangan','Rad etilgan','Muvaffaqiyatsiz','Kutilmoqda'],datasets:[{data:[approved,declined,failed,pending],backgroundColor:['#157A4A','#B3261E','#A15C00','#8A93A3']}]},
      options:{plugins:{legend:{position:'bottom',labels:{boxWidth:9,font:{size:10.5}}}},cutout:'62%',maintainAspectRatio:false}});
  }
}

function runM360FeeSim(id){
  const m=STATE.merchants.find(x=>x.id===id); if(!m) return;
  const p=getMerchantProfile(m);
  const amountEl=document.getElementById('m360FeeAmount'); const methodEl=document.getElementById('m360FeeMethod');
  if(!amountEl||!methodEl) return;
  const amount=parseFloat(amountEl.value)||0;
  const method=methodEl.value;
  const mdr=parseFloat(p.pricing[method])||1.8;
  const mdrFee=Math.round(amount*mdr/100);
  const fixedFee=p.pricing.fixedFee;
  const netFee=Math.round(amount*(p.pricing.settlementFee/100));
  const net=amount-mdrFee-fixedFee-netFee;
  document.getElementById('m360FeeResult').innerHTML=
    '<div class="panel" style="background:var(--surface-alt)">'+

function renderChargebacks(){
  const f=getFilter('cb');
  let rows=applySearch(STATE.chargebacks,f.search,['id','transactionId','merchantName','reasonCode']);
  if(f.status!=='all') rows=rows.filter(c=>c.status===f.status);
  const p=paginate(rows,f.page,8);
  const open=STATE.chargebacks.filter(c=>['Yangi','Ko\u2018rib chiqilmoqda','Dalil talab qilinadi','Representment'].includes(c.status));
  const won=STATE.chargebacks.filter(c=>c.status==='G\u2018alaba qozonildi').length;
  const lost=STATE.chargebacks.filter(c=>c.status==='Yutqazildi').length;
  const dueSoon=STATE.chargebacks.filter(c=>{const d=daysBetween(new Date(),c.deadline);return d>=0&&d<=3;}).length;
  return `
  <div class="page-header">
    <div><h1>Chargebacklar / Nizolar</h1><div class="desc">Chargeback lifecycle: qabul qilish &rarr; tekshirish &rarr; dalil &rarr; representment &rarr; yechim.</div></div>
  </div>
  <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr)">
    <div class="kpi-card"><div class="label">Ochiq nizolar</div><div class="value">${open.length}</div></div>
    <div class="kpi-card"><div class="label">Muddati yaqin (&le;3 kun)</div><div class="value" style="color:var(--red)">${dueSoon}</div></div>
    <div class="kpi-card"><div class="label">G'alaba qozonilgan</div><div class="value" style="color:var(--green)">${won}</div></div>
    <div class="kpi-card"><div class="label">Yutqazilgan</div><div class="value" style="color:var(--red)">${lost}</div></div>
    <div class="kpi-card"><div class="label">Chargeback ratio</div><div class="value">${computeKPIs().cbRate.toFixed(2)}%</div></div>
  </div>
  ${toolbarHTML('cb',"CB ID, tranzaksiya, merchant bo'yicha qidirish...",['Yangi',"Ko\u2018rib chiqilmoqda",'Dalil talab qilinadi','Representment',"G\u2018alaba qozonildi",'Yutqazildi','Hal qilindi'])}
  <div class="table-scroll">
  <table class="data-table"><thead><tr>
    <th>CB ID</th><th>Merchant</th><th class="num">Summa</th><th>Sabab kodi</th><th>Sxema</th><th>Muddat</th><th>Holat</th>
  </tr></thead><tbody>
  ${p.rows.map(c=>`
    <tr data-action="open-chargeback" data-id="${c.id}">
      <td class="mono" style="font-weight:600">${c.id}</td>
      <td>${esc(c.merchantName)}</td>
      <td class="num">${fmtMoney(c.amount,c.currency)}</td>
      <td class="mono">${c.reasonCode}</td>
      <td style="color:var(--text-2)">${esc(c.scheme)}</td>
      <td>${deadlineBadge(c.deadline)}</td>
      <td>${badge(c.status)}</td>
    </tr>`).join('')}
  </tbody></table>
  ${pagerHTML('cb',p)}
  </div>
  `;
}

    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${(stageIdx/6*100)}%;background:${c.status==='Yutqazildi'?'var(--red)':c.status==='G\u2018alaba qozonildi'?'var(--green)':'var(--blue)'}"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--text-3)">${stages.map(s=>`<span>${s}</span>`).join('')}</div>

    <svg style="width:20px;height:20px;color:${c.evidenceUploaded?'var(--green)':'var(--text-3)'}"><use href="#i-doc"/></svg>
    <div style="flex:1">

      <div style="font-size:11.5px;color:var(--text-3)">Invoice, yetkazib berish tasdig'i, mijoz bilan yozishmalar</div>

    <div class="kpi-card"><div class="label">Amalga oshirilgan</div><div class="value">${fmtCompact(doneAmt)}</div></div>

function paintAnalyticsCharts(){
  const days=[]; const vals=[];
  for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*86400000); days.push(d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit'}));
    vals.push(STATE.transactions.filter(t=>t.createdAt.toDateString()===d.toDateString()&&t.status==='Muvaffaqiyatli').reduce((s,t)=>s+t.amount,0)/1e6); }
  const c1=document.getElementById('chartAnGmv');
  if(c1) charts.angmv=new Chart(c1,{type:'bar',data:{labels:days,datasets:[{data:vals,backgroundColor:'#2C4CE0',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:'#EEF0F4'}},x:{grid:{display:false},ticks:{font:{size:9.5}}}},maintainAspectRatio:false}});
  const aov={}; const cnt={};
  STATE.transactions.forEach(t=>{ aov[t.paymentMethod]=(aov[t.paymentMethod]||0)+t.amount; cnt[t.paymentMethod]=(cnt[t.paymentMethod]||0)+1; });
  const labels=Object.keys(aov); const data=labels.map(k=>Math.round(aov[k]/cnt[k]/1000));
  const c2=document.getElementById('chartAnAov');
  if(c2) charts.anaov=new Chart(c2,{type:'bar',data:{labels,datasets:[{data,backgroundColor:'#6339B8',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:'#EEF0F4'},title:{display:true,text:"ming so'm",font:{size:9.5}}},x:{grid:{display:false},ticks:{font:{size:9.5}}}},maintainAspectRatio:false}});
}

function doRefundTx(id){
  const t=STATE.transactions.find(x=>x.id===id); if(!t) return;
  openConfirm('Tranzaksiyani qaytarish', t.id+' bo\u2018yicha '+fmtMoney(t.amount,t.currency)+' summasini to\u2018liq qaytarishni tasdiqlaysizmi? Bu amalni ortga qaytarib bo\u2018lmaydi.', 'Refund qilish', true, ()=>{
    const before=t.status; t.status='Qaytarilgan';
    STATE.refunds.unshift({id:uid('RF',STATE.refunds.length+STATE.seq.rf+1), transactionId:t.id, merchantId:t.merchantId, merchantName:t.merchantName,
      amount:t.amount, currency:t.currency, type:'To\u2018liq', reason:'Admin tomonidan boshlangan', status:'Bajarildi', requestedBy:'Admin', date:new Date()});
    pushAudit(null,'Tranzaksiya qaytarildi','Transactions',t.id,before,t.status);
    closeDrawer(); refreshPage(); toast(t.id+' muvaffaqiyatli qaytarildi','ok');
  });
}
function doSuspendMerchant(id){
  const m=STATE.merchants.find(x=>x.id===id); if(!m) return;
  openConfirm('Merchantni to\u2018xtatish', '"'+m.businessName+'" merchantini to\u2018xtatishni tasdiqlaysizmi? Bu holatda yangi tranzaksiyalar qabul qilinmaydi.', "To\u2018xtatish", true, ()=>{
    const before=m.status; m.status='To\u2018xtatilgan';
    pushAudit(null,'Merchant to\u2018xtatildi','Merchants',m.id,before,m.status);
    closeDrawer(); refreshPage(); toast(m.businessName+' to\u2018xtatildi','ok');
  });
}
function doActivateMerchant(id){
  const m=STATE.merchants.find(x=>x.id===id); if(!m) return;
  const before=m.status; m.status='Faol';
  pushAudit(null,'Merchant qayta faollashtirildi','Merchants',m.id,before,m.status);
  closeDrawer(); refreshPage(); toast(m.businessName+' qayta faollashtirildi','ok');
}
function doChargebackDecision(id,decision){
  const c=STATE.chargebacks.find(x=>x.id===id); if(!c) return;
  if(decision==='accept'){
    openConfirm('Chargebackni qabul qilish', c.id+' bo\u2018yicha '+fmtMoney(c.amount,c.currency)+' mablag\u2018ni mijozga qaytarishni tasdiqlaysizmi?', 'Qabul qilish', true, ()=>{
      const before=c.status; c.status='Yutqazildi';
      pushAudit(null,'Chargeback qabul qilindi (mablag\u2018 qaytarildi)','Chargebacks',c.id,before,c.status);
      closeDrawer(); refreshPage(); toast(c.id+' qabul qilindi','ok');
    });
  } else {
    const before=c.status; c.status='Representment';
    pushAudit(null,'Chargeback bo\u2018yicha bahslashish boshlandi','Chargebacks',c.id,before,c.status);
    closeDrawer(); refreshPage(); toast(c.id+' representment bosqichiga o\u2018tdi','ok');
  }
}
function doUploadEvidence(id){
  const c=STATE.chargebacks.find(x=>x.id===id); if(!c) return;
  c.evidenceUploaded=true; const before=c.status; if(c.status==='Yangi') c.status='Dalil talab qilinadi';
  pushAudit(null,'Chargeback dalili yuklandi','Chargebacks',c.id,before,c.status);
  openChargebackDrawer(c); toast('Dalil fayllari yuklandi (demo)','ok');
}
function doMatchException(id){
  const r=STATE.reconExceptions.find(x=>x.id===id); if(!r) return;

  refreshPage(); toast(r.id+' moslashtirildi','ok');

/* ================================================================
   EVENT DELEGATION
   ================================================================ */
function mainClickDelegate(e){
  const navBtn=e.target.closest('[data-action="nav"]');
  if(navBtn){ e.preventDefault(); const panel=document.getElementById('notifPanel'); if(panel) panel.remove(); showPage(navBtn.dataset.page); closeDrawer(); return; }

  const tabBtn=e.target.closest('.tab-btn');
  if(tabBtn){
    const group=tabBtn.dataset.group;
    document.querySelectorAll('.tab-btn[data-group="'+group+'"]').forEach(b=>b.classList.toggle('active', b===tabBtn));
    document.querySelectorAll('[data-tabpanel][data-group="'+group+'"]').forEach(p=>{ p.style.display=(p.dataset.tabpanel===tabBtn.dataset.tab)?'':'none'; });
    if(group==='m360') STATE.currentMerchantTab=tabBtn.dataset.tab;
    return;
  }

  let el;
  if((el=e.target.closest('[data-action="open-tx"]'))){ const t=STATE.transactions.find(x=>x.id===el.dataset.id); if(t) openTxDrawer(t); return; }
  if((el=e.target.closest('[data-action="open-merchant"]'))){ e.preventDefault(); const m=STATE.merchants.find(x=>x.id===el.dataset.id); if(m){ STATE.currentMerchantId=m.id; STATE.currentMerchantTab='overview'; const panel=document.getElementById('notifPanel'); if(panel) panel.remove(); showPage('merchant360'); } return; }

  if((el=e.target.closest('[data-action="m360-menu-toggle"]'))){ e.stopPropagation(); toggleM360Menu(el,el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-suspend"]'))){ openSuspendMerchantModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-activate"]'))){ openActivateMerchantModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-edit"]'))){ openEditMerchantModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-request-info"]'))){ openRequestInfoModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-create-mid"]'))){ openCreateMidModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-change-pricing"]'))){ openChangePricingModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-adjust-limits"]'))){ openAdjustLimitsModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-export"]'))){ m360Export(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-goto-tab"]'))){ m360GotoTab(el.dataset.tab); return; }
  if((el=e.target.closest('[data-action="m360-toggle-cap"]'))){ doToggleCapability(el.dataset.id,el.dataset.cap); return; }
  if((el=e.target.closest('[data-action="m360-health-info"]'))){ openHealthInfoModal(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="m360-period"]'))){ setM360Period(el.dataset.period); return; }
  if((el=e.target.closest('[data-action="m360act"]'))){ handleM360Action(el.dataset.type,el.dataset.id,el); return; }
  if((el=e.target.closest('[data-action="open-chargeback"]'))){ const c=STATE.chargebacks.find(x=>x.id===el.dataset.id); if(c) openChargebackDrawer(c); return; }
  if((el=e.target.closest('[data-action="open-settlement"]'))){ const s=STATE.settlements.find(x=>x.id===el.dataset.id); if(s) openSettlementDrawer(s); return; }
  if((el=e.target.closest('[data-action="open-acquirer"]'))){ const a=STATE.acquirers.find(x=>x.id===el.dataset.id); if(a) openAcquirerDrawer(a); return; }

  if(e.target.closest('[data-action="close-drawer"]')){ closeDrawer(); return; }
  if(e.target.id==='drawerOverlay'){ closeDrawer(); return; }
  if(e.target.closest('[data-action="close-modal"]')){ closeModal(); return; }
  if(e.target.id==='modalCenter'){ closeModal(); return; }

  if((el=e.target.closest('[data-action="refund-tx"]'))){ doRefundTx(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="suspend-merchant"]'))){ doSuspendMerchant(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="activate-merchant"]'))){ doActivateMerchant(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="accept-chargeback"]'))){ doChargebackDecision(el.dataset.id,'accept'); return; }
  if((el=e.target.closest('[data-action="contest-chargeback"]'))){ doChargebackDecision(el.dataset.id,'contest'); return; }
  if((el=e.target.closest('[data-action="upload-evidence"]'))){ doUploadEvidence(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="match-exception"]'))){ doMatchException(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="toggle-risk-rule"]'))){ doToggleRiskRule(el.dataset.id); return; }
  if((el=e.target.closest('[data-action="open-modal"]'))){ if(el.dataset.modal==='new-risk-rule') openNewRiskRuleModal(); return; }
  if(e.target.closest('[data-action="create-api-key"]')){ doCreateApiKey(); return; }
  if((el=e.target.closest('[data-action="revoke-api-key"]'))){ doRevokeApiKey(el.dataset.id); return; }
  if(e.target.closest('[data-action="copy-key"]')){ toast('Kalit clipboardga nusxalandi (demo)','ok'); return; }
  if((el=e.target.closest('[data-action="retry-webhook"]'))){ doRetryWebhook(el.dataset.id); return; }
  if(e.target.closest('[data-action="run-fee-sim"]')){ runFeeSim(); return; }

  if((el=e.target.closest('[data-action="page"]'))){
    const key=el.dataset.key; const f=getFilter(key); f.page+=parseInt(el.dataset.dir,10); refreshPage(); return;
  }
}
function mainInputDelegate(e){
  if(e.target.matches('[data-action="search"]')){
    const key=e.target.dataset.key; const val=e.target.value;
    const f=getFilter(key); f.search=val; f.page=1;
    refreshPage();
    const ni=document.querySelector('[data-action="search"][data-key="'+key+'"]');
    if(ni){ ni.focus(); const p=val.length; try{ni.setSelectionRange(p,p);}catch(err){} }
  }
}
function mainChangeDelegate(e){
  if(e.target.matches('[data-action="filter-status"]')){
    const key=e.target.dataset.key; const f=getFilter(key); f.status=e.target.value; f.page=1; refreshPage();
  }
  if(e.target.matches('[data-action="m360-metric-select"]')){
    setM360Metric(e.target.value);
  }
}

    document.getElementById('sidebar').classList.toggle('collapsed', STATE.sidebarCollapsed);
  });
  document.getElementById('envToggle').addEventListener('click', function(e){
    const btn=e.target.closest('button'); if(!btn) return;
    document.querySelectorAll('#envToggle button').forEach(b=>b.classList.remove('active','sandbox'));
    btn.classList.add('active'); if(btn.dataset.env==='sandbox') btn.classList.add('sandbox');
    STATE.env=btn.dataset.env;
    toast(btn.dataset.env==='sandbox' ? "Sandbox muhitiga o\u2018tildi" : "Production muhitiga o\u2018tildi", 'ok');
  });
  document.getElementById('notifBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleNotifPanel(); });
  document.getElementById('globalSearch').addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const q=e.target.value.trim(); if(!q) return;
    const ql=q.toLowerCase();
    let tx=STATE.transactions.find(t=>t.id.toLowerCase()===ql || t.rrn===q || t.orderId.toLowerCase()===ql);
    if(tx){ openTxDrawer(tx); return; }
    let m=STATE.merchants.find(mm=>mm.id.toLowerCase()===ql || mm.businessName.toLowerCase().includes(ql) || mm.contractNumber.toLowerCase()===ql);
    if(m){ STATE.currentMerchantId=m.id; STATE.currentMerchantTab='overview'; showPage('merchant360'); return; }
    let cb=STATE.chargebacks.find(c=>c.id.toLowerCase()===ql);
    if(cb){ openChargebackDrawer(cb); return; }
    let st=STATE.settlements.find(s=>s.id.toLowerCase()===ql);
    if(st){ openSettlementDrawer(st); return; }
    toast('"'+q+'" bo\u2018yicha natija topilmadi', 'err');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
      e.preventDefault(); document.getElementById('globalSearch').focus();
    }
    if(e.key==='Escape'){ closeDrawer(); closeModal(); }
  });
  document.addEventListener('click', mainClickDelegate);
  document.addEventListener('input', mainInputDelegate);
  document.addEventListener('change', mainChangeDelegate);
}

document.addEventListener('DOMContentLoaded', function(){
  initChrome();
  showPage('overview');
  setInterval(function(){
    liveSeconds+=3;
    const el=document.getElementById('liveUpdated');
    if(el) el.textContent=liveSeconds+" soniya oldin";
  }, 3000);
});
</script>
</body>
</html>
